          <b>${esc(b.name)}</b><span>${esc(b.desc)}</span>
          ${earned ? '<span class="chip gold" style="margin-top:7px">Earned</span>' : '<span class="chip line" style="margin-top:7px">Locked</span>'}
        </div>`;
      };
      const challenges = [
        ['Ten-terminal challenge', 'Wire a circuit using at least 10 manual terminal connections, validate it clean, and save it as a project.'],
        ['Full eclipse survival', 'Tune the CubeSat so the battery SoC never drops below 40% across three simulated orbits.'],
        ['Two-launch comparison', 'Run two rocket launches (different skip settings), then compare them in Mission Control.'],
        ['Documentation hero', 'Generate a repository bundle for a project with a circuit, an aerospace config and simulation results — all three sections present.']
      ];
      return `
      <div class="card pad-lg" style="margin-bottom:16px">
        <div class="spread">
          <div class="row" style="gap:14px">
            <div class="avatar avatar-lg" style="background:linear-gradient(145deg,var(--gold),var(--gold-dark));color:#2E2408">${li.level}</div>
            <div><h2 style="font-size:21px">Level ${li.level} — ${['Novice','Apprentice','Maker','Builder','Engineer','Senior','Principal','Architect','Chief','Fellow','Master','Legend'][li.level - 1] || 'Engineer'}</h2>
            <div class="small muted">${p.xp} XP · ${p.streak.count}-day streak · ${p.badges.length}/${App.BADGES.length} badges</div></div>
          </div>
          <div style="min-width:220px"><div class="progress-label"><span>${li.next ? 'to Level ' + (li.level + 1) : 'Max level'}</span><span>${li.next ? li.into + '/' + li.span : li.pct + '%'}</span></div><div class="progress gold"><i style="width:${li.pct}%"></i></div></div>
        </div>
      </div>
      <h2 style="font-size:19px;margin-bottom:10px">Engineering missions</h2>
      <div class="grid c2" style="align-items:start">
        <div class="stack" style="gap:8px">
          <div class="tag">Beginner</div>${tiers.Beginner.map(missionRow).join('')}
        </div>
        <div class="stack" style="gap:8px">
          <div class="tag">Intermediate</div>${tiers.Intermediate.map(missionRow).join('')}
          <div class="tag" style="margin-top:8px">Advanced</div>${tiers.Advanced.map(missionRow).join('')}
        </div>
      </div>
      <h2 style="font-size:19px;margin:18px 0 10px">Badges</h2>
      <div class="badge-grid">${App.BADGES.map(badgeCard).join('')}</div>
      <h2 style="font-size:19px;margin:18px 0 10px">Engineering challenges (self-paced)</h2>
      <div class="grid c2">
        ${challenges.map(ch => '<div class="card"><h3 style="font-size:14.5px">' + I('flag', 14) + ' ' + ch[0] + '</h3><p class="small muted" style="margin:0">' + ch[1] + '</p></div>').join('')}
      </div>`;
    },
    mount() {}
  };

  /* ================= FEEDBACK ================= */
  App.Feedback = {
    add(fb) {
      App.Store.state.feedback.unshift({...fb, at: Date.now(), id: App.uid('fb')});
      if (App.Store.state.feedback.length > 60) App.Store.state.feedback.length = 60;
      App.Store.save();
    }
  };
  App.Routes.feedback = {
    title: 'Feedback', crumb: 'Help shape CircuitVerse Studio',
    render() {
      const list = App.Store.state.feedback;
      const catBtn = (id, label) => '<button class="btn sm ghost fb-cat" data-cat="' + id + '">' + label + '</button>';
      return `
      <div class="grid c2" style="max-width:980px">
        <div class="card pad-lg">
          <h3 style="font-size:17px">${I('chat', 15)} Tell us what you think</h3>
          <div class="field" style="margin-top:12px"><label>Overall rating</label>
            <div class="stars" id="fb-stars">${[1,2,3,4,5].map(i => '<button data-v="' + i + '">' + App.IF('star', 24) + '</button>').join('')}</div>
          </div>
          <div class="field"><label>Category</label>
            <div class="row">${catBtn('bug', 'Bug report')}${catBtn('feature', 'Feature request')}${catBtn('suggestion', 'General suggestion')}${catBtn('general', 'General')}</div>
          </div>
          <div class="field"><label>Message</label><textarea class="input" id="fb-msg" placeholder="What worked? What broke? What should exist?"></textarea></div>
          <div class="field"><label>Follow-up email (optional)</label><input class="input" id="fb-email" type="email" placeholder="you@example.com"></div>
          <button class="btn primary" id="fb-send" style="width:100%">${I('send', 14)} Submit feedback</button>
          <div class="info-banner honest" style="margin-top:12px">${I('alert', 14)}<span><b>Honest storage:</b> no backend is configured in this build, so feedback is stored <b>locally in this browser</b> — it is not sent to any team. Export it below and share the file yourself.</span></div>
        </div>
        <div class="stack">
          <div class="card"><h3>${I('download', 15)} Export feedback</h3>
            <p class="small muted">Download every feedback entry as JSON (handy for emailing a teacher or the dev team).</p>
            <button class="btn sm primary" id="fb-export">${I('download', 13)} Export feedback JSON</button>
          </div>
          <div class="card"><h3>${I('clock', 15)} Submitted locally (${list.length})</h3>
            <div id="fb-list" style="max-height:330px;overflow:auto">${list.length ? list.map(f => `
              <div class="fb-item"><div class="spread"><b class="small">${{'bug':'Bug report','feature':'Feature request','suggestion':'Suggestion','general':'General'}[f.cat] || 'General'}</b>
              <span class="tiny muted">${App.fmtDT(f.at)}</span></div>
              <div class="tiny muted" style="margin:2px 0">${'\u2605'.repeat(f.rating)}${'\u2606'.repeat(5 - f.rating)}</div>
              <div class="small">${esc(f.msg)}</div>${f.email ? '<div class="tiny muted" style="margin-top:4px">follow-up: ' + esc(f.email) + '</div>' : ''}</div>`).join('') : '<div class="tiny muted">Nothing submitted yet.</div>'}</div>
          </div>
        </div>
      </div>`;
    },
    mount() {
      let rating = 0, cat = 'general';
      const stars = document.querySelectorAll('#fb-stars button');
      const paint = () => stars.forEach((b, i) => b.classList.toggle('on', i < rating));
      stars.forEach((b, i) => b.addEventListener('click', () => { rating = i + 1; paint(); }));
      document.querySelectorAll('.fb-cat').forEach(b => b.addEventListener('click', () => {
        cat = b.dataset.cat;
        document.querySelectorAll('.fb-cat').forEach(x => x.classList.toggle('primary', x === b));
      }));
      document.getElementById('fb-send').addEventListener('click', () => {
        const msg = document.getElementById('fb-msg').value.trim();
        if (!rating) { App.UI.toast('Please choose a star rating first.', 'warn'); return; }
        if (msg.length < 5) { App.UI.toast('Please write a short message (5+ characters).', 'warn'); return; }
        const email = document.getElementById('fb-email').value.trim();
        if (email && !App.Auth.validEmail(email)) { App.UI.toast('That email does not look valid.', 'warn'); return; }
        App.Feedback.add({rating, cat, msg, email});
        document.getElementById('fb-msg').value = '';
        document.getElementById('fb-email').value = '';
        rating = 0; paint();
        App.Router.render();
        App.UI.toast('Feedback stored locally in this browser — thank you!');
      });
      document.getElementById('fb-export').addEventListener('click', () => {
        App.download('circuitverse_feedback.json', JSON.stringify({note: 'Stored locally by CircuitVerse Studio; submitted by the device owner.', entries: App.Store.state.feedback}, null, 2), 'application/json');
        App.UI.toast('Feedback exported.');
      });
    }
  };
})();

</script>
<script>
'use strict';
/* ============================================================
   BOOT
   ============================================================ */
App.init = function () {
  App.Store.load();
  App.buildSidebar();
  // shell wiring
  const nt = document.getElementById('nav-toggle');
  nt.innerHTML = App.I('menu', 18);
  nt.addEventListener('click', () => App.toggleNav());
  document.getElementById('backdrop').addEventListener('click', () => App.toggleNav(false));
  document.addEventListener('click', e => {
    const a = e.target.closest('.nav-item');
    if (a) App.toggleNav(false);
  });
  if (App.Store.state.settings.reduceMotion) document.body.classList.add('reduce-motion');
  if (App.Auth.current()) App.Profile.updateStreak();
  window.addEventListener('hashchange', () => App.Router.render());
  window.addEventListener('beforeunload', () => App.Store.saveNow());
  App.Router.render();
  //console.info('CircuitVerse Studio v' + App.VERSION + ' ready');
};
document.addEventListener('DOMContentLoaded', App.init);

</script>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="backdrop" id="backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="nav-toggle" aria-label="Toggle navigation"></button>
        <div class="page-head"><h1 id="page-title">CircuitVerse Studio</h1><div class="crumb" id="page-crumb"></div></div>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <main id="view" class="view"></main>
      <footer class="foot">
        <span>CircuitVerse Studio · Design. Simulate. Explore. · Build. Learn. Innovate.</span>
        <span>Educational simulations only — values shown are simulated, not real hardware readings.</span>
      </footer>
    </div>
  </div>
  <div class="ghost-comp" id="ghost-comp"></div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
</body>
</html>
