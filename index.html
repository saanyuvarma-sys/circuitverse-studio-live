    ctx.strokeStyle = '#C5A66A'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
};
E.render = function () {
  const cv = E.canvas, ctx = E.ctx;
  if (!cv) return;
  const wrap = cv.parentElement || E.stage;
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth || 800, H = wrap.clientHeight || 500;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  E.drawScene(ctx, W, H, E, E.view, E.mode === 'sim' ? E.simStates : null,
    {sel: E.sel, hover: E.hover, wireDrag: E.wireDrag, armed: E.armed, mouse: E.mouse});
  if (E.st) E.st.animT = (E.st.animT || 0) + 1;
};
E.simStates = {leds: {}, pins: {}, motors: {}, gates: {}, animT: 0};
E.st = E.simStates;

E.loop = function () {
  E.raf = requestAnimationFrame(E.loop);
  E.render();
};

/* ---------- history hint ---------- */
E.updateHint = function () {
  const el = document.getElementById('ehint');
  if (!el) return;
  let msg;
  if (E.wireDrag) msg = 'Release on a <b>terminal</b> to complete the wire · Esc to cancel';
  else if (E.armed) msg = 'Click the canvas to place <b>' + DEFS[E.armed].name + '</b> · Esc to cancel';
  else if (E.activeExp && E.checkExperiment) {
    const chk = E.checkExperiment();
    if (!chk.complete && chk.activeStep) {
      if (chk.activeStep.type === 'place') {
        msg = '👉 <b>Live Guide:</b> Place <b>' + App.esc(chk.activeStep.compName) + '</b> on canvas (drag from library)';
      } else if (chk.activeStep.type === 'wire') {
        msg = '👉 <b>Live Guide:</b> ' + App.esc(chk.activeStep.instruction) + ' (drag from pulsing terminal)';
      } else {
        msg = 'Drag a component from the library · <b>drag terminal→terminal</b> to wire';
      }
    } else if (chk.complete) {
      msg = '🎉 <b>Circuit Complete:</b> All connections active &amp; verified. Simulation running!';
    } else {
      msg = 'Drag a component from the library, or click it then click the canvas · <b>drag terminal→terminal</b> to wire';
    }
  }
  else if (E.mode === 'sim') msg = 'Simulate mode — click <b>buttons &amp; switches</b> to interact. Terminals show live states.';
  else msg = 'Drag a component from the library, or click it then click the canvas · <b>drag terminal→terminal</b> to wire';
  el.innerHTML = msg;
};

/* ---------- selection / edit ops ---------- */
E.select = function (sel) { E.sel = sel; E.renderInspector(); };
E.deleteSel = function () {
  if (!E.sel) return;
  if (E.sel.type === 'comp') {
    E.wires = E.wires.filter(w => w.a.cid !== E.sel.id && w.b.cid !== E.sel.id);
    E.comps = E.comps.filter(c => c.id !== E.sel.id);
  } else {
    E.wires = E.wires.filter(w => w.id !== E.sel.id);
  }
  E.sel = null;
  E.markDirty(); E.renderInspector(); E.updateHint();
  if (E.renderAssistant) E.renderAssistant();
};
E.rotateSel = function () {
  if (E.sel && E.sel.type === 'comp') {
    const c = E.compById(E.sel.id);
    if (c) { c.rot = ((c.rot || 0) + 90) % 360; E.markDirty(); }
  }
};
E.place = function (key, wx, wy, customProps, customLabel) {
    const d = DEFS[key];
    const props = Object.assign(JSON.parse(JSON.stringify(d.props || {})), customProps || {});
    const c = {id: App.uid('c'), key, x: E.snap(wx - d.w / 2), y: E.snap(wy - d.h / 2), rot: 0,
      props: props, label: customLabel || d.name};
    E.comps.push(c);
  E.select({type: 'comp', id: c.id});
  const p = App.Profile.get(); if (p) { p.stats.comps = (p.stats.comps || 0) + 1; App.Store.save(); }
  E.markDirty(); E.updateHint();
  if (E.renderAssistant) E.renderAssistant();
  return c;
};
E.addWire = function (a, b) {
  if (!a || !b) return null;
  if (a.cid === b.cid && a.pid === b.pid) { App.UI.toast('Cannot connect a terminal to itself.', 'warn'); return null; }
  const dup = E.wires.find(w => (w.a.cid === a.cid && w.a.pid === a.pid && w.b.cid === b.cid && w.b.pid === b.pid) ||
                               (w.a.cid === b.cid && w.a.pid === b.pid && w.b.cid === a.cid && w.b.pid === a.pid));
  if (dup) { App.UI.toast('These terminals are already wired.', 'warn'); return null; }
  const w = {id: App.uid('w'), a: {cid: a.cid, pid: a.pid}, b: {cid: b.cid, pid: b.pid}};
  E.wires.push(w);
  const p = App.Profile.get(); if (p) { p.stats.wires = (p.stats.wires || 0) + 1; App.Store.save(); }
  E.markDirty();
  if (E.activeExp && E.checkExperiment) {
    const chk = E.checkExperiment();
    if (chk.complete) {
      if (!E.sim.running) {
        setTimeout(() => {
          E.startSim();
          E.syncToolbar();
          App.UI.toast('🎉 Circuit completely built and verified! Starting simulation...', 'gold');
          App.Profile.addXP(75, 'Completed Guided Experiment: ' + chk.exp.title);
        }, 150);
      }
    }
    if (E.renderAssistant) E.renderAssistant();
  }
  return w;
};
E.fitView = function () {
  const cv = E.canvas; if (!cv) return;
  const wrap = cv.parentElement || E.stage;
  const W = wrap.clientWidth || 800, H = wrap.clientHeight || 500;
  if (!E.comps.length) { E.view = {x: 0, y: 0, s: 1}; return; }
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  E.comps.forEach(c => { const d = DEFS[c.key]; minX = Math.min(minX, c.x); minY = Math.min(minY, c.y); maxX = Math.max(maxX, c.x + d.w); maxY = Math.max(maxY, c.y + d.h); });
  const s = App.clamp(Math.min((W - 80) / (maxX - minX + 100), (H - 80) / (maxY - minY + 100)), .35, 1.5);
  E.view.s = s;
  E.view.x = (W - (maxX - minX) * s) / 2 - minX * s;
  E.view.y = (H - (maxY - minY) * s) / 2 - minY * s;
  E.updateZoomHud();
};
E.zoom = function (factor, cx, cy) {
  const cv = E.canvas;
  const wrap = (cv && cv.parentElement) || E.stage;
  const W = wrap.clientWidth || 800, H = wrap.clientHeight || 500;
  const px = cx == null ? W / 2 : cx, py = cy == null ? H / 2 : cy;
  const old = E.view.s;
  E.view.s = App.clamp(E.view.s * factor, .3, 3);
  E.view.x = px - (px - E.view.x) * (E.view.s / old);
  E.view.y = py - (py - E.view.y) * (E.view.s / old);
  E.updateZoomHud();
};
E.updateZoomHud = function () {
  const el = document.getElementById('zoom-label');
  if (el) el.textContent = Math.round(E.view.s * 100) + '%';
};
E.markDirty = function () {
  E.dirty = true;
  if (E.mode === 'sim') { E.revalidateSoon && E.revalidateSoon(); }
  E.persistIntoProject && E.persistIntoProject();
};

</script>
<script>
'use strict';
/* ============================================================
   LAB 01 — ELECTRONICS ENGINE
   Part 2: net solver · digital simulation · validation ·
   panels (inspector/pins/log/issues) · page assembly
   ============================================================ */
(function () {
  const E = App.E; const DEFS = App.E.DEFS; const CATS = App.E.CATS;

  /* ================= NET SOLVER ================= */
  function UF() {
    const p = new Map();
    return {
      add(k) { if (!p.has(k)) p.set(k, k); },
      find(k) { this.add(k); while (p.get(k) !== k) { p.set(k, p.get(p.get(k))); k = p.get(k); } return k; },
      uni(a, b) { a = this.find(a); b = this.find(b); if (a !== b) p.set(a, b); }
    };
  }
  const tk = (cid, pid) => cid + '.' + pid;

  E.buildNets = function () {
    const uf = UF();
    E.comps.forEach(c => DEFS[c.key].pins.forEach(pin => uf.add(tk(c.id, pin.id))));
    E.wires.forEach(w => uf.uni(tk(w.a.cid, w.a.pid), tk(w.b.cid, w.b.pid)));
    E.comps.forEach(c => {
      if (c.key === 'sw' && c.props.closed) uf.uni(tk(c.id, 'a'), tk(c.id, 'b'));
      if (c.key === 'btn' && c.props.pressed) uf.uni(tk(c.id, 'a'), tk(c.id, 'b'));
    });
    return uf;
  };

  /* ---------- evaluate digital state ----------
     Honest scope: digital connectivity simulation (HIGH/LOW nets,
     LED/button/switch behaviour, simple logic ICs). No analog
     current/voltage solving, no Arduino C++ execution. */
  E.evaluate = function () {
    const uf = E.buildNets();
    const drivers = new Set(), grounds = new Set(), conflicts = [];
    const mode = (cid, pid) => (E.pinModes[cid] && E.pinModes[cid][pid]) || {mode: 'off', state: 'LOW'};
    E.comps.forEach(c => {
      if (c.key === 'src5' || c.key === 'bat9') { drivers.add(uf.find(tk(c.id, 'vcc'))); drivers.add(uf.find(tk(c.id, 'pos'))); grounds.add(uf.find(tk(c.id, 'gnd'))); grounds.add(uf.find(tk(c.id, 'neg'))); }
      if (c.key === 'gnd') grounds.add(uf.find(tk(c.id, 'g')));
      if (c.key === 'vcc') drivers.add(uf.find(tk(c.id, 'v')));
      if (c.key === 'ldr' && c.props.active) drivers.add(uf.find(tk(c.id, 'out')));
      if (c.key === 'ic555') { drivers.add(uf.find(tk(c.id, 'vcc'))); if (c.props._out) drivers.add(uf.find(tk(c.id, 'out'))); }
      if (c.key === 'arduino') DEFS[c.key].pins.forEach(pin => {
        const m = mode(c.id, pin.id);
        if (pin.type === 'gnd') grounds.add(uf.find(tk(c.id, pin.id)));
        if (pin.type === 'vcc') drivers.add(uf.find(tk(c.id, pin.id)));
        if (pin.id[0] === 'D' && m.mode === 'output' && m.state === 'HIGH') drivers.add(uf.find(tk(c.id, pin.id)));
      });
    });
    const isHigh = root => drivers.has(root);
    // logic ICs (single combinational pass — chained gates evaluated in component order)
    const gates = {}, pinState = {};
    E.comps.forEach(c => {
      if (c.key === 'gate_and') { const y = isHigh(uf.find(tk(c.id,'a'))) && isHigh(uf.find(tk(c.id,'b'))); gates[c.id] = y; if (y) drivers.add(uf.find(tk(c.id,'y'))); }
      if (c.key === 'gate_or')  { const y = isHigh(uf.find(tk(c.id,'a'))) || isHigh(uf.find(tk(c.id,'b'))); gates[c.id] = y; if (y) drivers.add(uf.find(tk(c.id,'y'))); }
      if (c.key === 'gate_not') { const y = !isHigh(uf.find(tk(c.id,'a'))); gates[c.id] = y; if (y) drivers.add(uf.find(tk(c.id,'y'))); }
      if (c.key === 'mux') { const y = isHigh(uf.find(tk(c.id,'s'))) ? isHigh(uf.find(tk(c.id,'b'))) : isHigh(uf.find(tk(c.id,'a'))); gates[c.id] = y; if (y) drivers.add(uf.find(tk(c.id,'y'))); }
      if (c.key === 'dff') {
        const clk = isHigh(uf.find(tk(c.id,'clk')));
        if (clk && !c.props._clk) c.props.q = isHigh(uf.find(tk(c.id,'d')));
        c.props._clk = clk;
        gates[c.id] = c.props.q;
        if (c.props.q) drivers.add(uf.find(tk(c.id,'q')));
      }
    });
    // resistor adjacency for "path through a resistor" searches
    const adj = new Map();
    const link = (a, b) => { if (!adj.has(a)) adj.set(a, []); if (!adj.has(b)) adj.set(b, []); adj.get(a).push(b); adj.get(b).push(a); };
    E.comps.forEach(c => { if (c.key === 'res') link(uf.find(tk(c.id,'a')), uf.find(tk(c.id,'b'))); });
    function reach(from, target, allowRes) {
      const seen = new Set([from]);
      const q = [from];
      while (q.length) {
        const r = q.shift();
        if (target(r)) return true;
        if (allowRes && adj.has(r)) adj.get(r).forEach(n => { if (!seen.has(n)) { seen.add(n); q.push(n); } });
      }
      return false;
    }
    const leds = {}, motors = {}, unsafe = [];
    E.comps.forEach(c => {
      if (c.key === 'led') {
        const a = uf.find(tk(c.id,'a')), k = uf.find(tk(c.id,'k'));
        const powered = reach(a, isHigh, true), grounded = reach(k, r => grounds.has(r), true);
        leds[c.id] = !!(powered && grounded);
        if (leds[c.id] && reach(a, isHigh, false)) unsafe.push(c);
      }
      if (c.key === 'motor') {
        const maH = reach(uf.find(tk(c.id,'a')), isHigh, true);
        const maG = reach(uf.find(tk(c.id,'a')), r => grounds.has(r), true);
        const mbH = reach(uf.find(tk(c.id,'b')), isHigh, true);
        const mbG = reach(uf.find(tk(c.id,'b')), r => grounds.has(r), true);
        motors[c.id] = (maH && mbG) || (mbH && maG);
      }
      if (c.key === 'servo') { c.props._active = isHigh(uf.find(tk(c.id,'sig'))); }
    });
    // INPUT pins read their net
    E.comps.forEach(c => {
      if (c.key !== 'arduino') return;
      DEFS.arduino.pins.forEach(pin => {
        const m = mode(c.id, pin.id);
        if (pin.id[0] === 'D' && m.mode === 'input') pinState[c.id + ':' + pin.id] = isHigh(uf.find(tk(c.id, pin.id))) ? 'HIGH' : 'LOW';
        if (pin.id[0] === 'A') pinState[c.id + ':' + pin.id] = isHigh(uf.find(tk(c.id, pin.id))) ? 'HIGH' : 'LOW';
        if (pin.id[0] === 'D' && m.mode === 'output') {
          pinState[c.id + ':' + pin.id] = m.state;
          if (m.state === 'HIGH' && grounds.has(uf.find(tk(c.id, pin.id)))) conflicts.push({c, pin, type: 'short'});
        }
      });
    });
    // hot wires (for colouring) + shorts
    const hotKeys = new Set(), shortKeys = new Set();
    E.wires.forEach(w => {
      const ra = uf.find(tk(w.a.cid, w.a.pid)), rb = uf.find(tk(w.b.cid, w.b.pid));
      if ((drivers.has(ra) && grounds.has(ra)) || (drivers.has(rb) && grounds.has(rb))) shortKeys.add(w.id);
      else if (drivers.has(ra) || drivers.has(rb)) hotKeys.add(w.id);
    });
    const shorts = [];
    // generic short: any net that is both driven HIGH and tied to ground (no load between)
    drivers.forEach(r => { if (grounds.has(r)) shorts.push(r); });
    E.comps.forEach(c => {
      if ((c.key === 'src5' || c.key === 'bat9')) {
        const vp = uf.find(tk(c.id, c.key === 'src5' ? 'vcc' : 'pos'));
        if (grounds.has(vp)) shorts.push(vp);
      }
    });
    E.lastEval = {hotKeys, shortKeys};
    return {leds, motors, gates, pinState, unsafe, shorts, conflicts, uf, drivers, grounds};
  };

  /* ================= VALIDATION ================= */
  E.validate = function (silent) {
    const issues = [];
    const st = E.evaluate();
    st.shorts.forEach(c => issues.push({sev: 'error', msg: 'Short circuit: the source terminals are directly connected with no load. Add a component (e.g. resistor + LED) between + and \u2212.'}));
    st.conflicts.forEach(cf => issues.push({sev: 'error', msg: 'Pin ' + cf.pin.label + ' is set OUTPUT HIGH but its net also reaches ground — possible driver conflict.'}));
    E.comps.forEach(c => {
      if (c.key === 'led') {
        const wiredA = E.wires.some(w => (w.a.cid === c.id && w.a.pid === 'a') || (w.b.cid === c.id && w.b.pid === 'a'));
        const wiredK = E.wires.some(w => (w.a.cid === c.id && w.a.pid === 'k') || (w.b.cid === c.id && w.b.pid === 'k'));
        if (!wiredA || !wiredK) issues.push({sev: 'warn', msg: DEFS.led.name + ' "' + (c.label || c.id) + '" has an unconnected leg. Wire both anode (A) and cathode (K).'});
        else if (st.leds[c.id] && st.unsafe.includes(c)) issues.push({sev: 'warn', msg: 'LED "' + (c.label || c.id) + '" is lit with no series resistor on its path. Add a 220\u03A9\u2013470\u03A9 resistor to model a real circuit safely.'});
      }
      if (c.key === 'btn' || c.key === 'sw') {
        const wired = E.wires.some(w => w.a.cid === c.id || w.b.cid === c.id);
        if (!wired) issues.push({sev: 'info', msg: DEFS[c.key].name + ' "' + (c.label || c.id) + '" is not wired to anything yet.'});
      }
      if (c.key === 'ic555') {
        const wired = E.wires.some(w => w.a.cid === c.id || w.b.cid === c.id);
        if (!wired) issues.push({sev: 'info', msg: '555 timer "' + (c.label || c.id) + '" has no wiring. Connect OUT to an LED through a resistor.'});
      }
    });
    E.wires.forEach(w => {
      if (!E.compById(w.a.cid) || !E.compById(w.b.cid)) issues.push({sev: 'error', msg: 'A wire references a deleted component — remove it.'});
    });
    E.issues = issues;
    E.renderIssues && E.renderIssues();
    if (!silent) {
      const hadError = E._hadIssues;
      if (hadError && !issues.some(i => i.sev === 'error')) { App.Missions.bump('repaired'); E._hadIssues = false; }
      if (issues.some(i => i.sev === 'error')) E._hadIssues = true;
    }
    return issues;
  };
  E.revalidateSoon = (() => { let t; return () => { clearTimeout(t); t = setTimeout(() => E.validate(true), 600); }; })();

  /* ================= SIMULATION LOOP ================= */
  E.startSim = function () {
    if (E.sim.running) return;
    const errs = E.validate(true).filter(i => i.sev === 'error');
    if (errs.length) App.UI.toast(errs[0].msg, 'warn');
    E.mode = 'sim';
    E.sim.running = true;
    E.sim.t = E.sim.t || 0;
    const p = App.Profile.get(); if (p) { p.stats.sims = (p.stats.sims || 0) + 1; App.Store.save(); }
    if (!E.sim.session) {
      const tracks = [];
      E.comps.forEach(c => {
        if (c.key === 'led') tracks.push({label: 'LED \u00B7 ' + (c.props.color || 'Red'), kind: 'digital', color: DEFS.led.colors[c.props.color] || '#D24A35', data: []});
        if (c.key === 'btn' || c.key === 'sw') tracks.push({label: DEFS[c.key].name + ' \u00B7 ' + (c.label || ''), kind: 'digital', color: '#C5A66A', data: []});
        if (c.key === 'arduino') Object.keys(E.pinModes[c.id] || {}).forEach(pid => {
          const m = E.pinModes[c.id][pid];
          if (m.mode !== 'off') tracks.push({label: 'Uno ' + pid + ' (' + m.mode + ')', kind: 'digital', color: '#46552B', data: []});
        });
      });
      E.sim.session = {id: App.uid('s'), type: 'electronics', name: E.projectName() || 'Untitled circuit', startedAt: Date.now(), rate: 4.5, dur: 0, tracks, events: [], meta: {}};
    }
    E.sim.log.push({t: Date.now(), msg: 'Simulation started (digital mode \u2014 HIGH/LOW logic, no analog current solving).'});
    E.sim.timer = setInterval(E.simTick, 220);
    E.simTick(); // evaluate immediately so LEDs/logic light up without the first 220 ms delay
    E.syncToolbar();
    App.Store.save();
  };
  E.pauseSim = function () {
    E.sim.running = false;
    clearInterval(E.sim.timer);
    E.sim.timer = null;
    E.sim.log.push({t: Date.now(), msg: 'Simulation paused.'});
    E.syncToolbar(); E.renderLog();
  };
  E.stopSim = function () {
    if (E.sim.timer) { clearInterval(E.sim.timer); E.sim.timer = null; }
    E.sim.running = false;
    // release buttons on stop
    E.comps.forEach(c => { if (c.key === 'btn' && c.props.momentary !== false) c.props.pressed = false; });
    if (E.sim.session && E.sim.session.tracks.some(t => t.data.length)) {
      E.sim.session.dur = E.sim.t / 1000;
      E.sim.session.events = E.sim.log.slice(-250).map(e => ({t: e.t, msg: e.msg}));
      E.sim.session.meta = {issues: E.validate(true).map(i => i.sev + ': ' + i.msg), mode: 'digital'};
      if (App.SimLab) App.SimLab.record(E.sim.session);
      E.sim.session = null;
    }
    E.sim.log.push({t: Date.now(), msg: 'Simulation stopped.'});
    E.mode = 'edit';
    E.syncToolbar(); E.renderLog();
    App.Store.save();
  };
  E.resetSim = function () {
    if (E.sim.timer) { clearInterval(E.sim.timer); E.sim.timer = null; }
    E.sim.running = false; E.mode = 'edit'; E.sim.t = 0;
    E.simStates = E.st = {leds: {}, pins: {}, motors: {}, gates: {}, animT: 0};
    E.comps.forEach(c => { if (c.key === 'btn' && c.props.momentary !== false) c.props.pressed = false; if (c.key === 'dff') { c.props.q = false; c.props._clk = false; } });
    E.sim.session = null;
    E.sim.log.push({t: Date.now(), msg: 'Simulation reset \u2014 all states cleared.'});
    E.validate(true);
    E.syncToolbar(); E.renderLog();
  };
  E.simTick = function () {
    if (!E.sim.running) return;
    E.sim.t += 220;
    let logNow = [];
    // blinking output pins
    E.comps.forEach(c => {
      if (c.key !== 'arduino') return;
      const modes = E.pinModes[c.id] || {};
      Object.keys(modes).forEach(pid => {
        const m = modes[pid];
        if (m.mode === 'output' && m.blink) {
          const half = (m.period || 1000) / 2;
          const s = Math.floor(E.sim.t / half) % 2 ? 'HIGH' : 'LOW';
          if (m.state !== s) { m.state = s; logNow.push('Uno ' + pid + ' \u2192 ' + s + ' (blink)'); }
        }
      });
    });
    // 555 astable toggle
    E.comps.forEach(c => {
      if (c.key !== 'ic555') return;
      const hz = parseFloat((c.props.freq || '2').replace(/[^\d.]/g, '')) || 2;
      const half = 500 / hz;
      const out = Math.floor(E.sim.t / half) % 2 === 0;
      if (!!c.props._out !== out) { c.props._out = out; logNow.push('555 OUT \u2192 ' + (out ? 'HIGH' : 'LOW')); }
    });
    const st = E.evaluate();
    E.simStates = E.st = {leds: st.leds, pins: st.pinState, motors: st.motors, gates: st.gates, animT: E.st.animT};
    // LED + button mission tracking and logs
    const prev = E.sim.prev;
    let ledChanged = false, btnChanged = false;
    E.comps.forEach(c => {
      if (c.key === 'led' && prev.led && prev.led[c.id] !== st.leds[c.id]) {
        ledChanged = true;
        logNow.push('LED "' + (c.label || c.props.color) + '" turned ' + (st.leds[c.id] ? 'ON' : 'OFF') + '.');
      }
      if ((c.key === 'btn' && c.props.pressed !== prev.btn) || (c.key === 'sw' && c.props.closed !== prev.sw)) btnChanged = true;
    });
    if (btnChanged) E.sim._btnAt = Date.now();
    if (ledChanged && E.sim._btnAt && Date.now() - E.sim._btnAt < 1600) App.Missions.bump('buttonLED');
    if (ledChanged && Object.values(st.leds).some(Boolean)) App.Missions.bump('ledLit');
    E.sim.prev = {led: st.leds, btn: E.comps.find(c => c.key === 'btn') && E.comps.find(c => c.key === 'btn').props.pressed, sw: E.comps.find(c => c.key === 'sw') && E.comps.find(c => c.key === 'sw').props.closed};
    logNow.forEach(m => E.sim.log.push({t: Date.now(), msg: m}));
    if (E.sim.session) {
      const vals = {};
      E.comps.forEach(c => {
        if (c.key === 'led') vals['LED \u00B7 ' + (c.props.color || 'Red')] = st.leds[c.id] ? 1 : 0;
        if (c.key === 'btn') vals[DEFS.btn.name + ' \u00B7 ' + (c.label || '')] = c.props.pressed ? 1 : 0;
        if (c.key === 'sw') vals[DEFS.sw.name + ' \u00B7 ' + (c.label || '')] = c.props.closed ? 1 : 0;
        if (c.key === 'arduino') Object.keys(E.pinModes[c.id] || {}).forEach(pid => {
          const m = E.pinModes[c.id][pid];
          if (m.mode !== 'off') vals['Uno ' + pid + ' (' + m.mode + ')'] = (m.mode === 'input' ? st.pinState[c.id + ':' + pid] : m.state) === 'HIGH' ? 1 : 0;
        });
      });
      E.sim.session.tracks.forEach(tr => tr.data.push(vals[tr.label] != null ? vals[tr.label] : 0));
      if (E.sim.session.tracks[0] && E.sim.session.tracks[0].data.length > 6000) E.sim.session.tracks.forEach(t => t.data.shift());
    }
    if (logNow.length || E.sim.t % 2200 < 220) { E.renderLog(); }
    E.renderInspector(true);
  };

  /* ================= SERIALIZATION & PROJECT PERSISTENCE ================= */
  E.serialize = function () {
    return {format: 2, comps: E.comps, wires: E.wires, pinModes: E.pinModes, view: E.view};
  };
  E.load = function (data) {
    E.reset();
    if (!data) return;
    if (Array.isArray(data.comps)) E.comps = data.comps;
    if (Array.isArray(data.wires)) E.wires = data.wires;
    if (data.pinModes) E.pinModes = data.pinModes;
    if (data.view) E.view = data.view;
    E.validate(true);
  };
  E.reset = function () {
    E.comps = []; E.wires = []; E.pinModes = {}; E.sel = null; E.armed = null;
    E.mode = 'edit'; E.sim.running = false; if (E.sim.timer) clearInterval(E.sim.timer); E.sim.timer = null;
    E.sim.t = 0; E.sim.log = []; E.sim.prev = {}; E.sim.session = null;
    E.simStates = E.st = {leds: {}, pins: {}, motors: {}, gates: {}, animT: 0};
    E.issues = []; E.lastEval = null;
  };
  E.projectName = function () {
    const id = App.Store.state.ui.activeProjectId;
    const pr = App.Store.state.projects.find(p => p.id === id);
    return pr ? pr.name : null;
  };
  E.persistIntoProject = function () {
    if (!App.Store.state.settings.autosave) return;
    const id = App.Store.state.ui.activeProjectId;
    if (!id) return;
    const pr = App.Store.state.projects.find(p => p.id === id);
    if (!pr) return;
    pr.data.electronics = E.serialize();
    pr.updatedAt = Date.now();
    App.Store.save();
    const chip = document.getElementById('save-chip');
    if (chip) chip.textContent = 'Saved \u2713 ' + new Date().toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
  };
  E.renderPNG = function (data) {
    const cv = document.createElement('canvas');
    cv.width = 1400; cv.height = 900;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#F6F0E4'; ctx.fillRect(0, 0, 1400, 900);
    const d = data || E;
    if (!d.comps.length) return null;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    d.comps.forEach(c => { const dd = DEFS[c.key]; minX = Math.min(minX, c.x); minY = Math.min(minY, c.y); maxX = Math.max(maxX, c.x + dd.w); maxY = Math.max(maxY, c.y + dd.h); });
    const s = App.clamp(Math.min(1250 / (maxX - minX + 100), 750 / (maxY - minY + 100)), .3, 2);
    const view = {s, x: (1400 - (maxX - minX) * s) / 2 - minX * s, y: (900 - (maxY - minY) * s) / 2 - minY * s};
    App.E.drawScene(ctx, 1400, 900, d, view, null, {noGrid: true, noTerminals: false});
    label(ctx, 'CircuitVerse Studio \u00B7 ' + (E.projectName() || 'Circuit'), 24, 874, 16, '#46552B', 'left', 1);
    return cv;
  };
  E.exportPNG = function () {
    const cv = E.renderPNG();
    if (!cv) { App.UI.toast('Place some components first.', 'warn'); return; }
    cv.toBlob(b => { App.download((E.projectName() || 'circuit').replace(/\s+/g, '_') + '_circuit.png', b); App.UI.toast('Circuit image exported.'); });
  };

  /* ================= PAGE ASSEMBLY ================= */
  App.Routes.electronics = {
    title: 'Electronics Lab', crumb: 'Lab 01 · Electronics · Design. Connect. Build.',
    render() {
      const projs = App.Store.state.projects;
      const act = App.Store.state.ui.activeProjectId;
      const opts = projs.map(p => '<option value="' + p.id + '"' + (p.id === act ? ' selected' : '') + '>' + App.esc(p.name) + '</option>').join('');
      return `
      <div class="lab-toolbar" id="etools">
        <div class="seg" id="emode-seg"><button data-m="edit" class="active">Edit</button><button data-m="sim">Simulate</button></div>
        <span class="sep"></span>
        <button class="btn sm primary" id="e-run">${App.I('play', 13)} Run</button>
        <button class="btn sm" id="e-pause">${App.I('pause', 13)} Pause</button>

    E.libraryHTML = function () {
    let html = '';
    CATS.forEach(cat => {
      html += '<div class="lib-cat">' + cat.name + '</div>';
      Object.keys(DEFS).forEach(k => {
        const d = DEFS[k];
        if (d.cat !== cat.id) return;
        html += '<button class="lib-item" data-key="' + k + '" title="' + App.esc(d.name) + ' \u2014 drag onto the canvas">' + App.I(d.icon, 15) + '<span>' + App.esc(d.name) + '</span></button>';
      });
    });
    html += '<div class="lib-cat">Guided experiments</div><div class="expt-list" id="e-expt-list">';
    (E.EXPERIMENTS || []).forEach(exp => {
      const active = E.activeExp === exp.id;
      html += '<div class="expt-card ' + (active ? 'active' : '') + '" data-exp-id="' + exp.id + '">';
      html += '<b><span>' + exp.num + ' \u00B7 ' + App.esc(exp.title) + '</span><span class="e-tag">' + exp.tier + '</span></b>';
      html += '<span class="desc">' + App.esc(exp.tagline) + '</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  };

  E.mountPage = function () {
    E.stage = document.getElementById('estage');
    E.canvas = document.getElementById('ecanvas');
    E.ctx = E.canvas ? E.canvas.getContext('2d') : null;
    const loaded = E._loadedFromRoute !== true;
    E._loadedFromRoute = true;
    // seed a friendly starter circuit BEFORE binding, so the workspace is never empty
    if (loaded && !E.comps.length) {
      // seed a WORKING, fully-wired example (battery -> resistor -> LED) so the
      // very first press of Run lights the LED with zero wiring required
      const bat = {id: App.uid('c'), key: 'bat9', x: 160, y: 170, rot: 0, props: {}, label: '9V Battery'};
      const r = {id: App.uid('c'), key: 'res', x: 360, y: 170, rot: 0, props: {value: '220\u03A9'}, label: 'Resistor'};
      const l = {id: App.uid('c'), key: 'led', x: 520, y: 170, rot: 0, props: {color: 'Red'}, label: 'LED'};
      E.comps.push(bat, r, l);
      E.addWire({cid: bat.id, pid: 'pos'}, {cid: r.id, pid: 'a'});
      E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
      E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
      E.fitView();
      E.validate(true);
    }
    // DOM is rebuilt on every route render — rebind listeners every time (old nodes are discarded)
    try { E.bindStage(); } catch (e) { console.warn('bindStage', e); }
    try { E.bindLibrary(); } catch (e) { console.warn('bindLibrary', e); }
    try { E.bindToolbar(); } catch (e) { console.warn('bindToolbar', e); }
    E.updateHint();
    if (!E.activeExp) E.activeExp = 'first_light';
    E.renderInspector(); E.renderPins(); E.renderLog(); E.renderIssues(); E.renderAssistant();
    const pb = document.getElementById('epanel-body'); if (pb && pb.dataset.tab === 'guide') E.renderGuide();
    cancelAnimationFrame(E.raf);
    E.loop();
    E.updateZoomHud();
  };
  E.unmountPage = function () {
    cancelAnimationFrame(E.raf); E.raf = 0;
    if (E.sim.timer) { clearInterval(E.sim.timer); E.sim.timer = null; }
    E.sim.running = false;
    document.removeEventListener('keydown', E._key);
  };

  /* ---------- stage pointer interaction ---------- */
  E.bindStage = function () {
    const cv = E.canvas;
    if (!cv) return;
    const pointers = new Map();
    let pinch = null;
    const evPos = e => {
      const r = cv.getBoundingClientRect();
      return {x: e.clientX - r.left, y: e.clientY - r.top};
    };
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic / inactive pointer */ }
      const sp = evPos(e);
      pointers.set(e.pointerId, sp);
      if (pointers.size === 2) { // pinch begins — cancel other gestures
        const pts = Array.from(pointers.values());
        pinch = {d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), s: E.view.s,
          cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2, vx: E.view.x, vy: E.view.y};
        E.wireDrag = null; E.moveDrag = null; E.panDrag = null;
        return;
      }
      const w = toWorld(sp.x, sp.y);
      if (E.armed && E.mode === 'edit') { E.place(E.armed, w.x, w.y); E.armed = null; App.$$('#elib .lib-item').forEach(el => el.classList.remove('armed')); E.updateHint(); return; }
      if (E.mode === 'sim') {
        const hit = compAt(w);
        if (hit && hit.key === 'btn') { hit.props.pressed = true; E.sim.log.push({t: Date.now(), msg: 'Button "' + (hit.label || '') + '" pressed.'}); E.validate(true); E.renderInspector(true); E.simTick(); return; }
        if (hit && hit.key === 'sw') { hit.props.closed = !hit.props.closed; E.sim.log.push({t: Date.now(), msg: 'Switch "' + (hit.label || '') + '" ' + (hit.props.closed ? 'CLOSED' : 'OPEN') + '.'}); E.validate(true); E.renderInspector(true); E.simTick(); return; }
        if (hit && hit.key === 'ldr') { hit.props.active = !hit.props.active; E.sim.log.push({t: Date.now(), msg: 'Light sensor ' + (hit.props.active ? 'LIGHT' : 'DARK') + '.'}); E.validate(true); E.renderInspector(true); E.simTick(); return; }
        if (hit) { E.select({type: 'comp', id: hit.id}); return; }
        return;
      }
      const term = terminalAt(w, 15);
      if (term) { E.wireDrag = {from: {cid: term.c.id, pid: term.pin.id}, pt: w}; E.updateHint(); return; }
      const comp = compAt(w);
      if (comp) {
        E.select({type: 'comp', id: comp.id});
        E.moveDrag = {c: comp, dx: w.x - comp.x, dy: w.y - comp.y};
        return;
      }
      const wire = wireAt(w);
      if (wire) { E.select({type: 'wire', id: wire.id}); return; }
      E.select(null);
      E.panDrag = {sx: sp.x, sy: sp.y, ox: E.view.x, oy: E.view.y};
    });
    cv.addEventListener('pointermove', e => {
      const sp = evPos(e);
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, sp);
      if (pinch && pointers.size === 2) {
        const pts = Array.from(pointers.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const cx = (pts[0].x + pts[1].x) / 2, cy = (pts[0].y + pts[1].y) / 2;
        const f = App.clamp(E.view.s * (d / pinch.d) / E.view.s, .3, 3);
        const ns = App.clamp(pinch.s * (d / pinch.d), .3, 3);
        E.view.s = ns;
        E.view.x = cx - (pinch.cx - pinch.vx) * (ns / pinch.s);
        E.view.y = cy - (pinch.cy - pinch.vy) * (ns / pinch.s);
        E.updateZoomHud();
        return;
      }
      const w = toWorld(sp.x, sp.y);
      E.mouse = {x: w.x, y: w.y, inside: true};
      if (E.wireDrag) { E.wireDrag.pt = w; E.hover = terminalAt(w, 16); }
      else if (E.moveDrag) { E.moveDrag.c.x = E.snap(w.x - E.moveDrag.dx); E.moveDrag.c.y = E.snap(w.y - E.moveDrag.dy); }
      else if (E.panDrag) { E.view.x = E.panDrag.ox + (sp.x - E.panDrag.sx); E.view.y = E.panDrag.oy + (sp.y - E.panDrag.sy); }
      else {
        E.hover = terminalAt(w, 12);
        cv.style.cursor = E.hover ? 'pointer' : (compAt(w) ? 'move' : 'crosshair');
      }
    });
    const finish = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      const sp = evPos(e);
      const w = toWorld(sp.x, sp.y);
      if (E.wireDrag) {
        const term = terminalAt(w, 18);
        if (term && !(term.c.id === E.wireDrag.from.cid && term.pin.id === E.wireDrag.from.pid)) {
          E.addWire(E.wireDrag.from, {cid: term.c.id, pid: term.pin.id});
          E.validate(true);
        }
        E.wireDrag = null; E.hover = null;
      }
      if (E.moveDrag) { E.moveDrag.c.x = E.snap(E.moveDrag.c.x); E.moveDrag.c.y = E.snap(E.moveDrag.c.y); E.moveDrag = null; E.persistIntoProject(); }
      E.panDrag = null;
      // release momentary buttons pressed in sim mode
      if (E.mode === 'sim') {
        let released = false;
        E.comps.forEach(c => { if (c.key === 'btn' && c.props.pressed && c.props.momentary !== false) { c.props.pressed = false; released = true; } });
        if (released) { E.sim.log.push({t: Date.now(), msg: 'Button released.'}); E.validate(true); E.renderInspector(true); E.simTick(); }
      }
      E.updateHint();
    };
    cv.addEventListener('pointerup', finish);
    cv.addEventListener('pointercancel', finish);
    cv.addEventListener('pointerleave', () => { E.mouse.inside = false; });
    cv.addEventListener('wheel', e => { e.preventDefault(); const sp = evPos(e); E.zoom(e.deltaY < 0 ? 1.12 : 0.9, sp.x, sp.y); }, {passive: false});
    // keyboard
    E._key = e => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (App.Router.resolve() !== 'electronics') return;
      if (e.key === 'Delete' || e.key === 'Backspace') { E.deleteSel(); e.preventDefault(); }
      if (e.key === 'r' || e.key === 'R') E.rotateSel();
      if (e.key === 'Escape') { E.armed = null; E.wireDrag = null; App.$$('#elib .lib-item').forEach(el => el.classList.remove('armed')); E.updateHint(); }
    };
    document.addEventListener('keydown', E._key);
  };

  /* ---------- library drag & arm ---------- */
  E.bindLibrary = function () {
    const lib = document.getElementById('elib');
    if (!lib) return;
    lib.addEventListener('pointerdown', e => {
      const item = e.target.closest('.lib-item');
      if (!item) return;
      const key = item.dataset.key;
      const startX = e.clientX, startY = e.clientY;
      let moved = false;
      const ghost = document.getElementById('ghost-comp');
      ghost.innerHTML = App.I(DEFS[key].icon, 14) + '<span>' + App.esc(DEFS[key].name) + '</span>';
      const move = ev => {
        if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 12) { moved = true; ghost.style.display = 'flex'; }
        if (moved) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        ghost.style.display = 'none';
        if (moved) {
          const cv = E.canvas || E.stage;
          const r = cv.getBoundingClientRect();
          if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
            if (E.mode === 'sim') { App.UI.toast('Switch to Edit mode to add components.', 'warn'); return; }
            const w = toWorld(ev.clientX - r.left, ev.clientY - r.top);
            E.place(key, w.x, w.y);
          }
        } else {
          // tap / click = arm for click-to-place (still fully manual placement)
          if (E.mode === 'sim') { App.UI.toast('Switch to Edit mode to add components.', 'warn'); return; }
          E.armed = key;
          App.$$('.lib-item', lib).forEach(el => el.classList.toggle('armed', el === item));
          E.updateHint();
        }
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
    lib.addEventListener('click', e => {
      const card = e.target.closest('.expt-card');
      if (card && card.dataset.expId) {
        E.setExperiment(card.dataset.expId);
      }
    });
  };

  E.setExperiment = function (id) {
    const exp = E.EXPERIMENTS.find(x => x.id === id);
    if (!exp) return;
    E.activeExp = id;
    App.$$('.expt-card').forEach(c => c.classList.toggle('active', c.dataset.expId === id));
    E.renderAssistant();
    const pb = document.getElementById('epanel-body');
    if (pb && pb.dataset.tab === 'guide') E.renderGuide();
    App.UI.toast('Guided Experiment loaded: ' + exp.title, 'gold');
  };

  E.checkExperiment = function (exp) {
    if (!exp) exp = E.EXPERIMENTS.find(x => x.id === E.activeExp) || E.EXPERIMENTS[0];
    const compCounts = {};
    E.comps.forEach(c => { compCounts[c.key] = (compCounts[c.key] || 0) + 1; });
    
    const elementsStatus = exp.elements.map(el => {
      const placed = compCounts[el.key] || 0;
      return {
        key: el.key,
        name: el.name,
        role: el.role,
        needed: el.count,
        placed: placed,
        ok: placed >= el.count
      };
    });

    const allElementsOk = elementsStatus.every(e => e.ok);

    // Evaluate connections
    const uf = E.buildNets ? E.buildNets() : null;
    const tk = (cid, pid) => cid + '.' + pid;
    const connectionsStatus = exp.connections.map(conn => {
      const cFrom = E.comps.find(c => c.key === conn.from.comp);
      const cTo = E.comps.find(c => c.key === conn.to.comp);
      let wired = false;
      if (cFrom && cTo) {
        wired = E.wires.some(w => 
          (w.a.cid === cFrom.id && w.a.pid === conn.from.pin && w.b.cid === cTo.id && w.b.pid === conn.to.pin) ||
          (w.a.cid === cTo.id && w.a.pid === conn.to.pin && w.b.cid === cFrom.id && w.b.pid === conn.from.pin)
        );
        if (!wired && uf) {
          const rA = uf.find(tk(cFrom.id, conn.from.pin));
          const rB = uf.find(tk(cTo.id, conn.to.pin));
          if (rA && rB && rA === rB) wired = true;
        }
      }
      return {
        from: conn.from,
        to: conn.to,
        desc: conn.desc,
        cFrom,
        cTo,
        wired
      };
    });

    const allConnectionsOk = connectionsStatus.every(c => c.wired);
    const isVerified = exp.verify(E);

    // Compute active live step
    let activeStep = null;
    const missingEl = elementsStatus.find(e => !e.ok);
    if (missingEl) {
      activeStep = {
        type: 'place',
        compKey: missingEl.key,
        compName: missingEl.name,
        role: missingEl.role,
        title: 'Place Component: ' + missingEl.name,
        instruction: 'Add ' + missingEl.name + ' to the breadboard. Notice the highlighted item in the library on the left.'
      };
    } else {
      const missingConn = connectionsStatus.find(c => !c.wired);
      if (missingConn) {
        activeStep = {
          type: 'wire',
          conn: missingConn,
          cFrom: missingConn.cFrom,
          cTo: missingConn.cTo,
          title: 'Wire: ' + missingConn.from.label + ' → ' + missingConn.to.label,
          instruction: missingConn.desc + '. Connect the two glowing terminal markers on the canvas.'
        };
      } else {
        activeStep = {
          type: 'complete',
          title: 'Circuit Complete & Live',
          instruction: 'All connections verified! The circuit is operational.'
        };
      }
    }

    const res = {
      exp,
      elements: elementsStatus,
      connections: connectionsStatus,
      allElementsOk,
      allConnectionsOk,
      isVerified,
      activeStep,
      complete: allElementsOk && (allConnectionsOk || isVerified)
    };
    E.lastCheckExp = res;
    return res;
  };

      <button class="asst-toggle" id="asst-toggle-btn" title="${E.asstCollapsed ? 'Expand Details' : 'Collapse Details'}">${App.I('chev', 14)}</button>

    if (E.asstCollapsed) {
      asst.className = 'stage-assistant collapsed';
      asst.innerHTML = `<div class="asst-head">
        <div class="asst-title-area">
          <div class="asst-title">${App.I(exp.icon, 14)} <span><b>${exp.num}</b> · ${App.esc(exp.title)}</span> <span class="asst-tier">${exp.tier}</span></div>
          ${stepChip}
        </div>
        <div class="asst-actions">
          ${actionsHTML}
        </div>
      </div>`;
    } else {
      asst.className = 'stage-assistant';
      let html = `<div class="asst-head">
        <div class="asst-title-area">
          <div class="asst-title">${App.I(exp.icon, 14)} <span><b>${exp.num}</b> · ${App.esc(exp.title)}</span> <span class="asst-tier">${exp.tier}</span></div>
          ${stepChip}
        </div>
        <div class="asst-actions">
          ${actionsHTML}
        </div>
      </div>
      <div class="asst-body">
        <div class="asst-desc">${App.esc(exp.tagline)}</div>
        <div class="asst-grid-row">
          <div class="asst-col">
            <div class="asst-col-title">${App.I('cpu', 11)} 1. Suggested Elements (${status.elements.filter(e => e.ok).length}/${status.elements.length})</div>
            <div class="asst-elems">`;

      status.elements.forEach(el => {
        if (el.ok) {
          html += `<span class="asst-elem-tag ok">${App.I('check', 11)} ${App.esc(el.name)} (${el.placed}/${el.needed})</span>`;
        } else {
          html += `<span class="asst-elem-tag missing">${App.I('plus', 11)} ${App.esc(el.name)} <button class="asst-add-btn" data-add="${el.key}">+ Add</button></span>`;
        }
      });

      html += `</div>
            ${status.activeStep.type === 'place' ? `<button class="btn sm gold asst-quick-add" data-add="${status.activeStep.compKey}" style="margin-top:6px;padding:2px 8px;font-size:10.5px">+ Quick-Place ${App.esc(status.activeStep.compName)}</button>` : ''}
          </div>
          <div class="asst-col">
            <div class="asst-col-title">${App.I('wire', 11)} 2. Circuit Connections (${status.connections.filter(c => c.wired).length}/${status.connections.length})</div>
            <div class="asst-wires">`;

      status.connections.forEach((w, idx) => {
        const isDone = w.wired || status.complete;
        const isCurrent = !status.complete && status.activeStep.type === 'wire' && status.activeStep.conn === w;
        html += `<div class="asst-wire ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
          ${App.I(isDone ? 'check' : isCurrent ? 'zap' : 'wire', 11)}
          <span><b>Step ${idx + 1}:</b> ${App.esc(w.desc)}</span>
        </div>`;
      });

      html += `</div>
          </div>
        </div>`;

      if (status.complete) {
        html += `<div class="asst-success">
          ${App.I('zap', 13)}
          <span>Circuit Complete! All electrical paths active &amp; simulation running.</span>
          <button class="btn sm primary" id="asst-next-btn" style="margin-left:auto;padding:2px 8px;font-size:11px">Next Experiment &rarr;</button>
        </div>`;
        if (!E.sim.running && !E._autoSimStarted) {
          E._autoSimStarted = true;
          setTimeout(() => {
            E.startSim();
            E.syncToolbar();
            App.UI.toast('🎉 Circuit complete! Simulation started — watch it work!', 'gold');
            App.Missions.bump('ledLit');
          }, 150);
        }
      } else {
        E._autoSimStarted = false;
        html += `<div style="font-size:11px;color:var(--ink-soft);margin-top:5px">💡 <em>Follow the pulsing gold cues in the library and on circuit terminals.</em></div>`;
      }

      html += `</div>`;
      asst.innerHTML = html;
    }

    // Bind common Assistant actions
    const toggle = document.getElementById('asst-toggle-btn');
    if (toggle) toggle.addEventListener('click', () => { E.asstCollapsed = !E.asstCollapsed; E.renderAssistant(); });

    const browse = document.getElementById('asst-browse-btn');
    if (browse) browse.addEventListener('click', E.openExperimentsHub);

    const cleanBtn = document.getElementById('asst-clean-btn');
    if (cleanBtn) cleanBtn.addEventListener('click', () => E.startCleanExperiment(exp.id));

    const assemb = document.getElementById('asst-assemble-btn');
    if (assemb) assemb.addEventListener('click', () => E.autoAssembleExperiment(exp.id));

    const guideTab = document.getElementById('asst-guide-tab-btn');
    if (guideTab) guideTab.addEventListener('click', () => E.panelTab('guide'));

    const nextBtn = document.getElementById('asst-next-btn');
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        const curIdx = E.EXPERIMENTS.findIndex(x => x.id === exp.id);
        const nextExp = E.EXPERIMENTS[(curIdx + 1) % E.EXPERIMENTS.length];
        E.setExperiment(nextExp.id);
      });
    }

    App.$$('[data-add]', asst).forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        E.addMissingComponent(b.dataset.add);
      });
    });
  };

  E.renderGuide = function () {
    const body = document.getElementById('epanel-body');
    if (!body || (body.dataset.tab && body.dataset.tab !== 'guide')) return;
    const status = E.checkExperiment();
    const exp = status.exp;

    let html = `

      html += `<div class="insp-row" style="padding:6px 0">

    exp.connections.forEach((w, i) => {
      html += `<div style="background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px">
        <div style="font-weight:700;color:var(--olive-forest);margin-bottom:3px">Connection ${i + 1}</div>
        <div class="small">${App.esc(w.desc)}</div>
        <div class="tiny muted" style="margin-top:4px;font-family:var(--mono)">${App.esc(w.from.label)} → ${App.esc(w.to.label)}</div>

    html += `</div>

    <div class="track-label" style="margin-bottom:8px">Circuit Working Verification</div>
    <div style="background:${status.complete ? 'rgba(137,150,107,.18)' : 'rgba(197,166,106,.14)'};border:1px solid ${status.complete ? 'var(--sage)' : 'rgba(197,166,106,.5)'};border-radius:12px;padding:12px;margin-bottom:14px">
      <div style="font-weight:700;color:var(--olive-forest);display:flex;align-items:center;gap:6px">
        ${App.I(status.complete ? 'check' : 'alert', 14)}
        <span>${status.complete ? 'Circuit Complete & Functional' : 'Circuit Incomplete'}</span>
      </div>
      <div class="small muted" style="margin-top:4px">
        ${status.complete
          ? 'Current is flowing cleanly through the designated electrical path. Simulation is actively testing all components.'
          : 'Place all suggested elements and connect the wires as guided to complete the circuit loop.'}
      </div>
    </div>

    <div class="btn-row" style="margin-top:14px">
      <button class="btn sm primary" id="guide-assemble-btn">${App.I('play', 12)} Auto-Assemble & Test</button>
      <button class="btn sm ghost" id="guide-hub-btn">${App.I('book', 12)} Browse All Experiments</button>
    </div>`;

    body.innerHTML = html;

    const assemb = document.getElementById('guide-assemble-btn');
    if (assemb) assemb.addEventListener('click', () => E.autoAssembleExperiment(exp.id));

    const hub = document.getElementById('guide-hub-btn');
    if (hub) hub.addEventListener('click', E.openExperimentsHub);

    App.$$('[data-add]', body).forEach(b => {
      b.addEventListener('click', () => E.addMissingComponent(b.dataset.add));
    });

  E.openExperimentsHub = function () {
    const hubCard = exp => `
      <div class="exp-hub-card">
        <div>
          <div class="meta">
            <span class="chip gold">${exp.num}</span>
            <span class="tier-pill">${exp.tier}</span>
            <span class="tiny muted">· ${exp.category}</span>
          </div>
          <h3 style="margin-top:6px">${App.I(exp.icon, 16)} ${App.esc(exp.title)}</h3>

          <div class="elements-pill">

        </div>
        <div class="acts">
          <button class="btn sm primary" data-hub-start="${exp.id}">${App.I('play', 12)} Start Guided</button>
          <button class="btn sm ghost" data-hub-assemble="${exp.id}">${App.I('zap', 12)} Load & Run</button>

      </div>`;

    const m = App.UI.modal({

      </p>
      <div class="grid c2" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;max-height:65vh;overflow-y:auto;padding-right:4px">

      </div>`

  /* ---------- example circuits ---------- */
  E.loadExample = function (name) {
    if (E.sim.running) E.pauseSim();
    E.mode = 'edit';
    E.reset();
    if (name === 'blink') {
      const uno = E.place('arduino', 60, 40), r = E.place('res', 340, 250), l = E.place('led', 500, 250), g = E.place('gnd', 500, 350);
      E.addWire({cid: uno.id, pid: 'D13'}, {cid: r.id, pid: 'a'});
      E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
      E.addWire({cid: l.id, pid: 'k'}, {cid: g.id, pid: 'g'});
      E.pinModes[uno.id] = {D13: {mode: 'output', state: 'HIGH', blink: true, period: 1000}};
    } else if (name === 'button') {
      const bat = E.place('bat9', 100, 190), b = E.place('btn', 300, 190), r = E.place('res', 440, 190), l = E.place('led', 600, 190);
      E.addWire({cid: bat.id, pid: 'pos'}, {cid: b.id, pid: 'a'});
      E.addWire({cid: b.id, pid: 'b'}, {cid: r.id, pid: 'a'});
      E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
      E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
    } else { // 'led' — battery + resistor + LED
      const bat = E.place('bat9', 160, 170), r = E.place('res', 360, 170), l = E.place('led', 520, 170);
      E.addWire({cid: bat.id, pid: 'pos'}, {cid: r.id, pid: 'a'});
      E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
      E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
    }
    E.fitView(); E.validate(true);
    E.renderInspector(); E.updateHint(); E.syncToolbar(); E.renderAssistant();
    App.Store.save();
  };

  E.openExamples = function () {
    const card = (key, icon, title, desc) => `<div class="card"><h3>${App.I(icon, 15)} ${title}</h3><p class="small muted" style="margin-bottom:10px">${desc}</p><button class="btn sm primary" data-ex="${key}">${App.I('play', 12)} Load template</button></div>`;
    const m = App.UI.modal({
      title: 'Circuit Templates — Load a pre-wired schematic',
      wide: true,
      body: '<div class="grid c3" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr))">' +
        card('led', 'zap', 'LED + Battery', '9V battery → 220Ω resistor → LED. The classic first circuit — press Run and the LED lights instantly.') +
        card('blink', 'cpu', 'Blink D13', 'Arduino Uno D13 → resistor → LED → GND, blink preset applied. Run it and watch the LED pulse at 1 Hz.') +
        card('button', 'glove', 'Button + LED', 'Battery → push button → resistor → LED. Run, then press the button on the canvas to light the LED.') +
        '</div>'
    });
    App.$$('[data-ex]', m.el).forEach(b => b.addEventListener('click', () => {
      E.loadExample(b.dataset.ex);
      m.close();
      App.UI.toast('Template loaded — press Run to simulate.');
    }));
  };

/* ---------- toolbar ---------- */
  E.bindToolbar = function () {
    const $ = id => document.getElementById(id);
    const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); else console.warn('toolbar element missing:', id); };
    // NOTE: pass plain ids to the $ helper (getElementById) — never '#id'.
    // The old $('#emode-seg') call returned null and the thrown TypeError
    // silently killed EVERY toolbar binding below (Run/Pause/Stop/Reset/
    // Validate/PNG/Save/zoom/panel tabs were all dead).
    on('emode-seg', 'click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.m === 'sim') { E.startSim(); }                    // starts or resumes
      else { if (E.sim.running) E.pauseSim(); E.mode = 'edit'; }      // always returns to edit
      E.syncToolbar(); E.updateHint();
    });
    on('e-run', 'click', () => { E.startSim(); E.syncToolbar(); });
    on('e-pause', 'click', () => { E.pauseSim(); E.syncToolbar(); });
    on('e-stop', 'click', () => { E.stopSim(); E.syncToolbar(); });
    on('e-reset', 'click', () => { E.resetSim(); E.syncToolbar(); });
    on('e-guide', 'click', () => E.openExperimentsHub());
    on('e-examples', 'click', E.openExamples);
    on('e-rotate', 'click', E.rotateSel);
    on('e-del', 'click', E.deleteSel);
    on('e-validate', 'click', () => {
      const issues = E.validate(false);
      const errs = issues.filter(i => i.sev === 'error').length;
      App.UI.toast(errs ? errs + ' error(s) found — see the Issues panel.' : (issues.length ? issues.length + ' note(s) — see Issues panel.' : 'Circuit looks good. No issues found.'), errs ? 'warn' : 'ok');
      document.body.classList.add('panel-open');
      E.panelTab('issues');
    });
    on('e-png', 'click', E.exportPNG);
    on('e-proj', 'change', e => {
      App.Store.state.ui.activeProjectId = e.target.value || null;
      App.Store.save();
      if (e.target.value) {
        const pr = App.Store.state.projects.find(p => p.id === e.target.value);
        if (pr && pr.data.electronics && !E.comps.length) { E.load(pr.data.electronics); App.UI.toast('Loaded circuit from "' + pr.name + '".'); }
        E.persistIntoProject();
      }
    });
    on('e-save', 'click', () => {
      App.Auth.requireLogin(() => {
        const id = App.Store.state.ui.activeProjectId;
        if (!id) {
          App.UI.prompt('Save as new project', `<div class="field"><label>Project name</label><input class="input" name="name" value="My Circuit" maxlength="60"></div><div class="field"><label>Description</label><textarea class="input" name="desc" placeholder="What does this circuit do?"></textarea></div>`)
            .then(v => {
              if (!v) return;
              const pr = App.Projects.create(v.name, v.desc, 'electronics');
              pr.data.electronics = E.serialize();
              App.Store.state.ui.activeProjectId = pr.id;
              App.Store.save();
              E.persistIntoProject();
              const sel = $('e-proj');
              if (sel) sel.innerHTML = App.Store.state.projects.map(p => '<option value="' + p.id + '"' + (p.id === pr.id ? ' selected' : '') + '>' + App.esc(p.name) + '</option>').join('');
              App.UI.toast('Project "' + pr.name + '" created and saved.');
            });
        } else {
          E.persistIntoProject();
          const chip = $('save-chip');
          if (chip) {
            chip.style.display = '';
            chip.textContent = 'Saved \u2713 ' + new Date().toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
          }
          App.UI.toast('Circuit saved to project.');
        }
      }, 'Save Circuit Project');
    });
    on('z-in', 'click', () => E.zoom(1.2));
    on('z-out', 'click', () => E.zoom(0.83));
    on('z-fit', 'click', E.fitView);
    on('panel-toggle', 'click', () => document.body.classList.toggle('panel-open'));
    on('epanel-tabs', 'click', e => {
      const b = e.target.closest('button'); if (!b) return;
      E.panelTab(b.dataset.t);
    });
    E.syncToolbar();
  };
  E.panelTab = function (t) {
    App.$$('#epanel-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    const body = document.getElementById('epanel-body');
    if (!body) return;
    // set the tab FIRST — the render helpers below guard on body.dataset.tab,
    // so rendering before this assignment left the panel empty on first click
    body.dataset.tab = t;
    if (t === 'insp') E.renderInspector();
    if (t === 'pins') E.renderPins();
    if (t === 'guide') E.renderGuide();
    if (t === 'log') E.renderLog();
    if (t === 'issues') E.renderIssues();
  };
  E.syncToolbar = function () {
    const seg = document.getElementById('emode-seg');
    if (!seg) return;
    App.$$('#emode-seg button').forEach(b => b.classList.toggle('active', (b.dataset.m === 'sim') === (E.mode === 'sim')));
    const run = document.getElementById('e-run'), pause = document.getElementById('e-pause');
    if (run) run.disabled = E.sim.running;
    if (pause) pause.disabled = !E.sim.running;
  };

  /* ---------- panels ---------- */
