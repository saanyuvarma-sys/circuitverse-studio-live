<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CircuitVerse Studio — Design. Simulate. Explore.</title>
<meta name="description" content="CircuitVerse Studio — an engineering learning universe with Electronics, Aerospace and Simulation laboratories.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2346552B'/%3E%3Cpath d='M8 22h4l3-12 3 8 2-4h4' stroke='%23F6F0E4' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='22' r='2' fill='%23C5A66A'/%3E%3C/svg%3E">
<style>
/* ============================================================
   CIRCUITVERSE STUDIO — DESIGN TOKENS & SHELL
   Olive Academia × Pinterest Aesthetic × Engineering
   ============================================================ */
:root{
  --olive-deep:#46552B;
  --olive-forest:#354321;
  --olive-darker:#2A3618;
  --sage:#89966B;
  --olive-soft:#A8B18A;
  --ivory:#F6F0E4;
  --cream:#EFE7D7;
  --beige:#DED1B9;
  --gold:#C5A66A;
  --gold-dark:#A8853F;
  --graphite:#303329;
  --ink-soft:#5C6153;
  --white:#FFFFFF;
  --brick:#93402F;
  --shadow-sm:0 2px 8px rgba(48,51,41,.08);
  --shadow:0 6px 24px rgba(48,51,41,.10);
  --shadow-lg:0 14px 40px rgba(48,51,41,.16);
  --radius:16px;
  --radius-sm:10px;
  --line:rgba(70,85,43,.14);
  --line-strong:rgba(70,85,43,.26);
  --font-serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif;
  --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --sidebar-w:250px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{overscroll-behavior-y:contain}
body{font-family:var(--font-sans);background:var(--ivory);color:var(--graphite);font-size:15px;line-height:1.55;min-height:100vh}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{transition:none!important;animation:none!important}
h1,h2,h3,h4,.serif{font-family:var(--font-serif);font-weight:600;letter-spacing:.2px;color:var(--olive-forest);margin:0}
p{margin:0 0 .8em}
a{color:var(--olive-deep)}
img,svg,canvas{max-width:100%}
button{font-family:inherit}
::selection{background:rgba(168,177,138,.5)}
/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh;position:relative}
.sidebar{width:var(--sidebar-w);background:linear-gradient(178deg,var(--olive-forest) 0%,var(--olive-darker) 100%);color:var(--cream);position:relative;min-height:100vh;flex-shrink:0;z-index:60;display:flex;flex-direction:column;transition:transform .28s ease;overflow-y:auto;overflow-x:hidden}
.main{flex:1;margin-left:0;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}
.brand-logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--olive-deep),var(--olive-forest));display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(245,240,228,.18),0 4px 10px rgba(0,0,0,.25)}
.brand-name{font-family:var(--font-serif);font-size:17px;line-height:1.15;color:var(--cream);font-weight:600}
.brand-name small{display:block;font-family:var(--font-sans);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--olive-soft);font-weight:600}
.nav-group{padding:10px 12px 2px}
.nav-label{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:rgba(239,231,215,.42);padding:8px 10px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;margin:1px 0;border:0;border-radius:11px;background:transparent;color:rgba(239,231,215,.82);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .16s,color .16s;text-decoration:none}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:rgba(246,240,228,.08);color:var(--cream)}
.nav-item.active{background:rgba(168,177,138,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(168,177,138,.3)}
.nav-item.active svg{color:var(--gold)}
.nav-num{margin-left:auto;font-size:9.5px;letter-spacing:1px;color:rgba(197,166,106,.75);font-weight:700}
.sidebar-foot{margin-top:auto;padding:14px 18px 18px;color:rgba(239,231,215,.45);font-size:11px}
.sidebar-foot .leafy{opacity:.5;margin-bottom:8px}
.backdrop{position:fixed;inset:0;background:rgba(42,54,24,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
body.nav-open .backdrop{opacity:1;pointer-events:auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:13px;padding:11px clamp(14px,2.6vw,26px);background:rgba(246,240,228,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#nav-toggle{display:none}
.page-head{min-width:0;flex:1}
.page-head h1{font-size:clamp(19px,3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.xp-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:5px 12px;box-shadow:var(--shadow-sm)}
.xp-chip b{font-size:13px;color:var(--olive-forest)}
.xp-chip span{font-size:10px;color:var(--ink-soft);letter-spacing:.6px;text-transform:uppercase}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--sage),var(--olive-deep));color:var(--ivory);display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--gold);cursor:pointer;flex:none}
.view{flex:1;padding:26px clamp(14px,3vw,40px) 40px;width:100%;max-width:1440px;margin:0 auto}
.foot{padding:16px 24px;color:var(--ink-soft);font-size:11.5px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.page{animation:pageIn .3s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid transparent;background:var(--cream);color:var(--graphite);font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-decoration:none;user-select:none;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(150deg,var(--olive-deep),var(--olive-forest));color:var(--ivory);box-shadow:var(--shadow-sm)}
.btn.gold{background:linear-gradient(150deg,var(--gold),var(--gold-dark));color:#33280E}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--olive-deep)}
.btn.ghost:hover{background:rgba(137,150,107,.1)}
.btn.danger{background:#F6E8E2;color:var(--brick);border-color:rgba(147,64,47,.3)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.icon{padding:8px;border-radius:10px}
.btn.icon svg{display:block}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--white);color:var(--olive-deep);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--cream)}
/* ---------- cards & grids ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px}
.card.sage{background:linear-gradient(165deg,#F1F3E6,#E6EBD6)}
.card.pad-lg{padding:24px}
.card h3{font-size:16.5px;margin-bottom:6px}
.card h3 svg{vertical-align:-2px;margin-right:6px;color:var(--olive-deep)}
.card .sub{font-size:12.5px;color:var(--ink-soft)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(137,150,107,.16);color:var(--olive-forest);border:1px solid rgba(137,150,107,.3)}
.chip.gold{background:rgba(197,166,106,.16);color:var(--gold-dark);border-color:rgba(197,166,106,.4)}
.chip.brick{background:rgba(147,64,47,.1);color:var(--brick);border-color:rgba(147,64,47,.3)}
.chip.line{background:var(--white);border-color:var(--line-strong)}
.tag{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700;color:var(--gold-dark)}
.sim-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--gold-dark);background:rgba(197,166,106,.14);border:1px dashed rgba(197,166,106,.55);padding:3px 9px;border-radius:8px}
/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--olive-forest);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line-strong);background:var(--white);color:var(--graphite);font-size:14px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(137,150,107,.18)}
textarea.input{resize:vertical;min-height:90px}
.input-wrap{position:relative}
.input-wrap .eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-soft);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px}
.input-wrap .eye:hover{background:var(--cream);color:var(--olive-deep)}
.check{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--olive-deep)}
.toggle{position:relative;width:42px;height:24px;border-radius:999px;background:var(--beige);border:1px solid var(--line-strong);cursor:pointer;transition:background .18s;flex:none}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--white);box-shadow:var(--shadow-sm);transition:transform .18s}
.toggle.on{background:var(--olive-deep)}
.toggle.on::after{transform:translateX(18px)}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.seg button.active{background:var(--olive-deep);color:var(--ivory);box-shadow:var(--shadow-sm)}
.seg.gold button.active{background:var(--gold);color:#33280E}
input[type=range]{accent-color:var(--olive-deep);width:100%}
/* ---------- modal & toast ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(42,54,24,.5);z-index:200;display:grid;place-items:center;padding:18px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--ivory);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:88vh;display:flex;flex-direction:column;animation:pop .22s ease;overflow:hidden}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.modal-head h3{font-size:18px}
.modal-body{padding:6px 20px 18px;overflow-y:auto}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--cream)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:9px;max-width:min(92vw,360px)}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--olive-forest);color:var(--cream);padding:12px 14px;border-radius:14px;box-shadow:var(--shadow-lg);font-size:13px;animation:toastIn .3s ease;line-height:1.4}
.toast.gold{background:linear-gradient(140deg,var(--gold),var(--gold-dark));color:#2E2408}
.toast.warn{background:#7A5A22}
.toast.err{background:#6E342A}
.toast svg{flex:none;margin-top:1px}
@keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
/* ---------- progress ---------- */
.progress{height:9px;border-radius:999px;background:rgba(137,150,107,.22);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sage),var(--olive-deep));transition:width .4s ease}
.progress.gold>i{background:linear-gradient(90deg,var(--gold),var(--gold-dark))}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line-strong)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ---------- login page ---------- */
.login-hero{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-left{background:linear-gradient(165deg,var(--olive-forest),var(--olive-darker));color:var(--cream);padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login-left h1{color:var(--cream);font-size:clamp(28px,4.6vw,46px);line-height:1.12;margin:14px 0 10px;max-width:12em}
.login-left .lead{color:rgba(246,240,228,.75);font-size:15px;max-width:34em}
.login-labs{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.login-lab{background:rgba(246,240,228,.08);border:1px solid rgba(246,240,228,.16);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(4px)}
.login-lab b{display:block;font-size:12.5px;color:var(--cream)}
.login-lab span{font-size:10.5px;color:var(--olive-soft);letter-spacing:.8px}
.login-lab svg{color:var(--gold)}
.botanical{position:absolute;right:-40px;bottom:-40px;opacity:.14;pointer-events:none}
.login-right{display:grid;place-items:center;padding:clamp(20px,4vw,48px);background:
  radial-gradient(circle at 80% -10%,rgba(168,177,138,.25),transparent 55%),var(--ivory)}
.login-card{width:100%;max-width:420px}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px}
.auth-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);background:var(--cream);border:1px dashed var(--line-strong);border-radius:12px;padding:10px 13px;line-height:1.5}
.link-btn{background:none;border:0;color:var(--olive-deep);font-weight:600;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.form-err{background:rgba(147,64,47,.09);border:1px solid rgba(147,64,47,.3);color:var(--brick);border-radius:11px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:none}
/* ---------- dashboard ---------- */
.dash-hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.dash-hero h2{font-size:clamp(22px,3.4vw,30px)}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 24px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;min-height:108px;transition:transform .15s,box-shadow .15s}.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .v{font-family:var(--font-serif);font-size:22px;color:var(--olive-forest);font-weight:700}
.stat .k{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.stat .d{font-size:11px;color:var(--gold-dark);font-weight:600}
.lab-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-bottom:26px}
.lab-card{position:relative;border-radius:20px;overflow:hidden;color:var(--cream);min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;box-shadow:var(--shadow);border:1px solid rgba(42,54,24,.3);transition:transform .2s,box-shadow .2s;cursor:pointer;text-align:left}.lab-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.lab-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.lab-card .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lab-card .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,54,24,.05) 20%,rgba(42,54,24,.82) 82%)}
.lab-card .content{position:relative;display:flex;flex-direction:column;gap:6px}
.lab-card .tag{color:var(--gold)}
.lab-card h3{color:var(--cream);font-size:22px}
.lab-card p{margin:0;font-size:12.5px;color:rgba(246,240,228,.8);max-width:26em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lab-card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.lab-card .progress{background:rgba(246,240,228,.22);height:7px}
.lab-card .progress>i{background:var(--gold)}
.pill-btn{background:var(--gold);color:#2E2408;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:var(--shadow-sm)}
.notif{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.notif:last-child{border-bottom:0}
.notif svg{flex:none;color:var(--gold-dark);margin-top:2px}
.notif time{margin-left:auto;font-size:10.5px;color:var(--ink-soft);flex:none}
.proj-mini{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--white);cursor:pointer;transition:background .15s;text-align:left}
.proj-mini:hover{background:var(--cream)}
.proj-mini .ic{width:36px;height:36px;border-radius:10px;background:rgba(137,150,107,.18);display:grid;place-items:center;color:var(--olive-deep);flex:none}
.proj-mini b{font-size:13px;display:block}
.proj-mini span{font-size:11px;color:var(--ink-soft)}
/* ---------- laboratory layout ---------- */
.lab-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.lab-toolbar .sep{width:1px;height:24px;background:var(--line-strong);margin:0 3px;flex:none}
.lab-body{display:grid;grid-template-columns:264px minmax(0,1fr) 314px;gap:14px;align-items:stretch}
.lib{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:550px;position:sticky;top:76px}
.lib-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--ivory)}
.lib-head b{font-size:13px;letter-spacing:.6px}
.lib-scroll{overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch;flex:1}
.lib-cat{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:14px 4px 6px}
.lib-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:var(--ivory);cursor:grab;margin:4px 0;font-size:12.5px;font-weight:600;color:var(--graphite);transition:background .14s,border .14s;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none}
.lib-item:hover{background:var(--cream);border-color:var(--sage)}
.lib-item.armed{outline:2px solid var(--gold);background:rgba(197,166,106,.14)}
.lib-item svg{flex:none;color:var(--olive-deep)}
.stage{display:flex;flex-direction:column;position:relative;background:
  radial-gradient(circle at 30% 20%,rgba(168,177,138,.16),transparent 50%),
  linear-gradient(160deg,var(--cream),var(--beige) 120%);
  border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;height:calc(100vh - 180px);min-height:550px;touch-action:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.stage-canvas-wrap{flex:1;position:relative;min-height:0;width:100%;height:100%;overflow:hidden}
.stage-canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.stage-hint{position:absolute;left:14px;bottom:14px;background:rgba(48,51,41,.88);backdrop-filter:blur(6px);color:var(--cream);font-size:11.5px;padding:7px 14px;border-radius:999px;pointer-events:none;max-width:75%;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.1)}
.stage-hint b{color:var(--gold)}
.zoom-hud{position:absolute;right:14px;bottom:14px;display:flex;gap:5px;background:rgba(246,240,228,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:11px;padding:4px;box-shadow:var(--shadow-sm)}
.zoom-hud button{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--olive-deep);cursor:pointer;display:grid;place-items:center}
.zoom-hud button:hover{background:var(--cream)}
.zoom-hud span{font-size:10.5px;align-self:center;color:var(--ink-soft);min-width:38px;text-align:center}
.panel{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:550px;position:sticky;top:76px}
.panel-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--cream)}
.panel-tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.panel-tabs button.active{color:var(--olive-forest);border-bottom-color:var(--gold);background:rgba(255,255,255,.65)}
.panel-body{overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;flex:1}
.insp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.insp-row:last-child{border-bottom:0}
.insp-row .k{color:var(--ink-soft);font-weight:600}
.pin-row{display:grid;grid-template-columns:44px 1fr auto;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.pin-row b{font-family:var(--mono);font-size:11.5px}
.state-pill{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--beige);color:var(--graphite)}
.state-pill.high{background:var(--olive-deep);color:var(--ivory)}
.state-pill.on{background:var(--gold);color:#2E2408}
.log-line{font-family:var(--mono);font-size:10.8px;padding:4px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft);word-break:break-word}
.log-line b{color:var(--olive-forest)}
.log-line .t{color:var(--gold-dark);margin-right:6px}
.issue{display:flex;gap:8px;font-size:12px;padding:8px 10px;border-radius:10px;margin-bottom:7px;line-height:1.4;align-items:flex-start}
.issue svg{flex:none;margin-top:1px}
.issue.error{background:rgba(147,64,47,.09);color:var(--brick);border:1px solid rgba(147,64,47,.25)}
.issue.warn{background:rgba(197,166,106,.12);color:#7A5A22;border:1px solid rgba(197,166,106,.4)}
.issue.info{background:rgba(137,150,107,.1);color:var(--olive-forest);border:1px solid rgba(137,150,107,.3)}
.ghost-comp{position:fixed;z-index:400;pointer-events:none;background:var(--olive-deep);color:var(--cream);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:10px;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:7px;transform:translate(-50%,-130%)}
.ghost-comp svg{color:var(--gold)}
#panel-toggle{display:none}

/* ---------- interactive experiment assistant & cards ---------- */
.stage-assistant{position:relative;width:100%;flex:none;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.04);padding:8px 14px;font-size:12px;transition:all .2s ease;z-index:20}
.stage-assistant.collapsed{padding:6px 14px}
.stage-assistant.collapsed .asst-body{display:none}
.asst-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.asst-title-area{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.asst-title{font-size:13px;font-weight:700;color:var(--olive-forest);display:flex;align-items:center;gap:6px}
.asst-tier{font-size:9px;letter-spacing:1px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(197,166,106,.2);color:var(--gold-dark);border:1px solid rgba(197,166,106,.4)}
.asst-step-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line-strong);background:var(--ivory);color:var(--olive-deep)}
.asst-step-chip.place{background:rgba(197,166,106,.15);border-color:var(--gold);color:var(--gold-dark)}
.asst-step-chip.wire{background:rgba(70,85,43,.12);border-color:var(--olive-deep);color:var(--olive-deep)}
.asst-step-chip.ok{background:rgba(137,150,107,.2);border-color:var(--sage);color:var(--olive-forest)}
.asst-actions{display:flex;align-items:center;gap:5px;margin-left:auto}
.asst-toggle{background:none;border:0;cursor:pointer;color:var(--ink-soft);padding:3px;border-radius:6px;display:grid;place-items:center}
.asst-toggle:hover{background:var(--cream);color:var(--olive-deep)}
.asst-body{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.asst-grid-row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.4fr);gap:12px;align-items:start}
@media(max-width:960px){.asst-grid-row{grid-template-columns:1fr}}
.asst-col-title{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--olive-forest);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.asst-desc{margin:0 0 6px;font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.asst-sec-label{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--olive-forest);margin:6px 0 3px}
.asst-elems{display:flex;gap:5px;flex-wrap:wrap}
.asst-elem-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:600;border:1px solid var(--line)}
.asst-elem-tag.ok{background:rgba(137,150,107,.18);color:var(--olive-forest);border-color:var(--sage)}
.asst-elem-tag.missing{background:rgba(197,166,106,.15);color:var(--gold-dark);border-color:rgba(197,166,106,.45)}
.asst-add-btn{background:none;border:0;color:var(--olive-deep);font-weight:700;cursor:pointer;padding:0 3px;border-radius:4px;text-decoration:underline}
.asst-add-btn:hover{background:rgba(70,85,43,.1)}
.asst-wires{display:flex;flex-direction:column;gap:3px;max-height:85px;overflow-y:auto;padding-right:2px}
.asst-wire{display:flex;gap:6px;align-items:center;font-size:11px;padding:2px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft)}
.asst-wire:last-child{border-bottom:0}
.asst-wire.done{color:var(--olive-forest);font-weight:600}
.asst-wire.done svg{color:var(--olive-deep)}
.asst-wire.current{color:var(--gold-dark);font-weight:700;background:rgba(197,166,106,.12);padding:2px 6px;border-radius:5px}
.asst-success{background:linear-gradient(145deg,rgba(137,150,107,.2),rgba(197,166,106,.2));border:1.5px solid var(--sage);border-radius:9px;padding:6px 10px;margin-top:6px;text-align:center;color:var(--olive-forest);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px}
.asst-btn-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

.expt-card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;font-size:12px;background:var(--ivory);cursor:pointer;transition:all .15s;text-align:left;display:flex;flex-direction:column;gap:3px}
.expt-card:hover{border-color:var(--gold);background:var(--cream);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.expt-card.active{border-color:var(--gold);background:rgba(197,166,106,.16);box-shadow:0 0 0 1.5px var(--gold)}
.expt-card b{font-size:12.5px;color:var(--olive-forest);display:flex;align-items:center;justify-content:space-between}
.expt-card .e-tag{font-size:9px;letter-spacing:1px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--cream);color:var(--ink-soft);border:1px solid var(--line-strong)}
.expt-card.active .e-tag{background:var(--gold);color:#2E2408;border-color:var(--gold)}
.expt-card .desc{font-size:11.2px;color:var(--ink-soft);line-height:1.35}

.exp-hub-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px;transition:all .15s;height:100%;justify-content:space-between}
.exp-hub-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
.exp-hub-card h3{font-size:15px;display:flex;align-items:center;gap:7px;margin:0;color:var(--olive-forest)}
.exp-hub-card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.exp-hub-card .elements-pill{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.exp-hub-card .pill{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--cream);color:var(--ink-soft);border:1px solid var(--line-strong)}
.exp-hub-card .acts{display:flex;gap:6px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}

/* ---------- live guided targets & assistant styling ---------- */
@keyframes guideTargetPulse {
  0% { box-shadow: 0 0 0 0 rgba(197,166,106,.8); }
  65% { box-shadow: 0 0 0 8px rgba(197,166,106,0); }
  100% { box-shadow: 0 0 0 0 rgba(197,166,106,0); }
}
.lib-item.guided-target {
  border-color: var(--gold) !important;
  background: rgba(197,166,106,.18) !important;
  animation: guideTargetPulse 1.6s infinite;
  position: relative;
  font-weight: 700;
}
.lib-item.guided-target::after {
  content: 'PLACE NEXT';
  display: inline-block;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .6px;
  background: var(--gold);
  color: #2E2408;
  padding: 2px 5px;
  border-radius: 4px;
  margin-left: auto;
}
.asst-step-card {
  background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(246,240,228,0.92));
  border: 1.5px solid var(--gold);
  border-radius: 11px;
  padding: 10px 12px;
  margin: 8px 0;
  box-shadow: 0 2px 8px rgba(197,166,106,0.18);
}
.asst-step-card.complete {
  border-color: var(--sage);
  background: linear-gradient(145deg, rgba(230,235,214,0.95), rgba(241,243,230,0.92));
  box-shadow: 0 2px 8px rgba(137,150,107,0.2);
}
.asst-step-badge {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.asst-step-card.complete .asst-step-badge {
  color: var(--olive-forest);
}
.asst-step-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--olive-deep);
  margin-bottom: 3px;
}
.asst-step-inst {
  font-size: 11.5px;
  color: var(--ink-soft);
  line-height: 1.4;
}

/* ---------- welcome landing page ---------- */
.welcome-hero {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: linear-gradient(140deg, #F1F4E6 0%, #E8EED9 50%, #DFE7CD 100%);
  border: 1px solid var(--line-strong);
  padding: 36px 38px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.welcome-hero h1 {
  font-size: 32px;
  line-height: 1.2;
  color: var(--olive-deep);
  margin: 12px 0 10px;
  font-weight: 800;
}
.welcome-hero p.lead {
  font-size: 15px;
  color: var(--ink-soft);
  max-width: 680px;
  line-height: 1.55;
  margin-bottom: 22px;
}
.welcome-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.feature-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform .15s, box-shadow .15s;
}
.feature-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--sage);
}
.feature-card .feat-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(137,150,107,0.18);
  color: var(--olive-deep);
  display: grid;
  place-items: center;
  margin-bottom: 4px;
}
.feature-card h3 {
  font-size: 15px;
  color: var(--olive-forest);
  margin: 0;
}
.feature-card p {
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.45;
  margin: 0;
}

/* ---------- aero tabs ---------- */
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabbar button{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-strong);background:var(--white);color:var(--graphite);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.tabbar button.active{background:var(--olive-deep);border-color:var(--olive-deep);color:var(--ivory);box-shadow:var(--shadow-sm)}
.tabbar button svg{opacity:.8}
.viz-card canvas{display:block;width:100%;border-radius:12px;background:linear-gradient(170deg,#FDFBF6,#F1EADA)}
.cfg-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.cfg-row .k{color:var(--ink-soft);font-weight:600}
.cfg-row .v{font-family:var(--mono);font-size:12px;color:var(--olive-forest);font-weight:700;min-width:52px;text-align:right}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.gauge{background:var(--ivory);border:1px solid var(--line);border-radius:13px;padding:10px 12px;text-align:center}
.gauge .gv{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--olive-forest)}
.gauge .gk{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-top:2px}
.annunciator{display:flex;gap:8px;flex-wrap:wrap}
.ann{font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 12px;border-radius:8px;background:var(--beige);color:rgba(48,51,41,.4);border:1px solid var(--line)}
.ann.lit{background:var(--brick);color:var(--ivory);border-color:var(--brick);box-shadow:0 0 12px rgba(147,64,47,.4);animation:blink 1s step-end infinite}
.ann.gold.lit{background:var(--gold);border-color:var(--gold);color:#2E2408;animation:none}
@keyframes blink{50%{opacity:.55}}
.seq-step{display:flex;gap:10px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft)}
.seq-step.done{color:var(--olive-forest);font-weight:600}
.seq-step.done svg{color:var(--olive-deep)}
.seq-step.now{color:var(--gold-dark);font-weight:700}
.compat{border:1px dashed var(--line-strong);background:rgba(137,150,107,.08);border-radius:13px;padding:11px 13px;font-size:12.5px}
.compat.ok{border-color:var(--sage);background:rgba(137,150,107,.14)}
.compat .row{margin-top:8px}
/* 3D viewer */
.model3d-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line-strong);background:radial-gradient(circle at 50% 30%,#FDFBF6,#EDE4D0);min-height:380px;touch-action:none}
.model3d-wrap canvas{display:block;width:100%;height:100%;cursor:grab}
.model3d-wrap canvas:active{cursor:grabbing}
.part-item{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--ivory);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px}
.part-item:hover,.part-item.sel{border-color:var(--gold);background:rgba(197,166,106,.12)}
.part-item .dot{width:12px;height:12px;border-radius:4px;flex:none;border:1px solid rgba(48,51,41,.3)}
/* ---------- mission control ---------- */
.mc-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.sess-item{width:100%;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border .15s}
.sess-item:hover{border-color:var(--sage)}
.sess-item.sel{border-color:var(--gold);background:rgba(197,166,106,.1);box-shadow:var(--shadow-sm)}
.sess-item b{font-size:12.8px;display:block}
.sess-item .meta{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap}
.mc-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.track-label{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
/* ---------- projects ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:16px}
.proj-card{display:flex;flex-direction:column;gap:9px;height:100%;justify-content:space-between;min-height:210px}
.proj-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-card h3{font-size:16px}
.proj-card .desc{font-size:12.3px;color:var(--ink-soft);min-height:2.4em}
.proj-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search-wrap{position:relative;flex:1;min-width:170px;max-width:340px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search-wrap .input{padding-left:36px}
/* ---------- file tree (github) ---------- */
.tree{font-family:var(--mono);font-size:12px;background:var(--olive-forest);color:var(--cream);border-radius:13px;padding:13px 15px;overflow:auto;max-height:300px;line-height:1.7}
.tree .dir{color:var(--olive-soft);font-weight:700}
.tree .file{color:var(--cream);cursor:pointer;padding:0 4px;border-radius:5px}
.tree .file:hover,.tree .file.sel{background:rgba(197,166,106,.25);color:#fff}
.file-view{font-family:var(--mono);font-size:11.8px;background:var(--cream);border:1px solid var(--line-strong);border-radius:12px;padding:13px 15px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word}
/* ---------- achievements ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:13px}
.badge-card{border:1px solid var(--line);border-radius:15px;padding:16px 12px;text-align:center;background:var(--white);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:165px;transition:transform .15s,box-shadow .15s}.badge-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.badge-card .bic{width:52px;height:52px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--beige),var(--cream));color:var(--ink-soft)}
.badge-card.earned .bic{background:linear-gradient(145deg,var(--gold),var(--gold-dark));color:#2E2408;box-shadow:0 4px 12px rgba(197,166,106,.4)}
.badge-card b{font-size:12.5px;display:block}
.badge-card span{font-size:10.5px;color:var(--ink-soft)}
.badge-card.earned{border-color:rgba(197,166,106,.5)}
.mission-card{display:flex;gap:13px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--white);box-shadow:var(--shadow-sm);margin-bottom:12px;align-items:center}

/* ---------- SHA-256 (sync, for password hashing) ---------- */
App.sha256 = function (input) {
  const bytes = typeof input === 'string' ? new TextEncoder().encode(input) : input;
  const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, bitLenLo = (l * 8) % 4294967296, bitLenHi = Math.floor(l / 536870912);
  const padded = new Uint8Array((((l + 9) >> 6) + 1) << 6);
  padded.set(bytes); padded[l] = 0x80;
  const dv = padded.length - 8;
  padded[dv] = (bitLenHi >>> 24) & 255; padded[dv+1] = (bitLenHi >>> 16) & 255; padded[dv+2] = (bitLenHi >>> 8) & 255; padded[dv+3] = bitLenHi & 255;
  padded[dv+4] = (bitLenLo >>> 24) & 255; padded[dv+5] = (bitLenLo >>> 16) & 255; padded[dv+6] = (bitLenLo >>> 8) & 255; padded[dv+7] = bitLenLo & 255;
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = (padded[off+i*4]<<24) | (padded[off+i*4+1]<<16) | (padded[off+i*4+2]<<8) | padded[off+i*4+3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = H.map((hj, i) => (hj + [a,b,c,d,e,f,g,h][i]) >>> 0);
  }
  return H.map(x => ('00000000' + x.toString(16)).slice(-8)).join('');
};

/* ---------- persistent store ---------- */
App.Store = {
  KEY: 'circuitverse_studio_v2',
  state: null,
  defaults() {
    return {formatVersion: 2, users: {}, session: null, profiles: {}, projects: [], feedback: [], simSessions: [],
      settings: {reduceMotion: false, autosave: true, showGrid: true},
      ui: {activeProjectId: null}, meta: {createdAt: Date.now(), appVersion: App.VERSION}};
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { /* private mode */ }
    let s = null;
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    if (!s || s.formatVersion !== 2) {
      const fresh = this.defaults();
      if (s) ['users','projects','feedback','simSessions','profiles'].forEach(k => { if (s[k]) fresh[k] = s[k]; });
      if (s && s.settings) Object.assign(fresh.settings, s.settings);
      s = fresh;
    }
    if (!s.users) s.users = {};
    if (!s.users['engineer@circuitverse.local']) {
      s.users['engineer@circuitverse.local'] = {name: 'Circuit Engineer', email: 'engineer@circuitverse.local', createdAt: Date.now()};
    }
    // Guest exploration by default; preserve session if logged in
    if (!s.session || !s.session.email) {
      s.session = null;
    }
    this.state = s;
    return s;
  },
  _t: null,
  _quotaToastAt: 0,
  save() { clearTimeout(this._t); this._t = setTimeout(() => this.saveNow(), 250); },
  pruneSessions(keep) { // drop oldest simulation recordings; returns how many were removed
    const st = this.state;
    if (!st || !Array.isArray(st.simSessions)) return 0;
    const before = st.simSessions.length;
    if (keep == null) keep = Math.max(5, Math.floor(before / 2));
    st.simSessions.length = Math.min(before, keep);
    return before - st.simSessions.length;
  },
  saveNow() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); }
    catch (e) {
      // First aid: the usual culprit is a pile of old simulation recordings —
      // prune them and retry once before blaming the user's browser.
      let recovered = false;
      try {
        if (this.state && Array.isArray(this.state.simSessions) && this.state.simSessions.length > 5) {
          const removed = this.pruneSessions();
          localStorage.setItem(this.KEY, JSON.stringify(this.state));
          recovered = true;
          try { App.UI.toast('Storage was nearly full \u2014 ' + removed + ' old simulation recording(s) pruned to free space. Your projects and account are safe.', 'warn'); } catch (_) {}
        }
      } catch (_e) { /* still failing */ }
      if (!recovered) {
        // Distinguish blocked storage (private window / site data disabled) from a full quota
        let blocked = false;
        try { localStorage.setItem(this.KEY + '__probe', '1'); localStorage.removeItem(this.KEY + '__probe'); }
        catch (_e2) { blocked = true; }
        const msg = blocked
          ? 'Browser storage is blocked (private window or site data disabled) \u2014 work cannot be saved. Export your data from Settings.'
          : 'Browser storage is genuinely full \u2014 export your data from Settings, then use "Free up space" or "Clear everything" to continue.';
        try {
          if (!this._quotaToastAt || Date.now() - this._quotaToastAt > 60000) { this._quotaToastAt = Date.now(); App.UI.toast(msg, 'warn'); }
        } catch (_) {}
      }
    }
  },
  exportAll() { return JSON.stringify(this.state, null, 2); },
  importAll(json) {
    const s = JSON.parse(json);
    if (!s || s.formatVersion !== 2) throw new Error('Unsupported file format');
    this.state = s; this.saveNow();
  }
};

/* ---------- event bus ---------- */
App.Bus = {
  m: {},
  on(e, f) { (this.m[e] = this.m[e] || []).push(f); },
  emit(e, d) { (this.m[e] || []).forEach(f => { try { f(d); } catch (err) { console.error('bus', e, err); } }); }
};

/* ---------- authentication (seamless guest exploration + save-gated sign in) ---------- */
App.Auth = {
  current() {
    const s = App.Store && App.Store.state ? App.Store.state.session : null;
    if (s && s.email) {
      const users = (App.Store && App.Store.state && App.Store.state.users) || {};
      const u = users[s.email];
      const name = (u && u.name) || s.name || 'Circuit Engineer';
      return {guest: false, name, email: s.email, pid: s.pid || ('usr_' + s.email.replace(/[^a-zA-Z0-9]/g, '_'))};
    }
    return {guest: true, name: 'Guest Explorer', email: null, pid: 'guest'};
  },
  isLoggedIn() {
    const c = this.current();
    return !!(c && !c.guest && c.email);
  },
  validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); },
  login(email, pw, name) {
    email = (email || 'engineer@circuitverse.local').trim().toLowerCase();
    name = (name || (App.Store.state.users[email] && App.Store.state.users[email].name) || 'Circuit Engineer').trim();
    if (!App.Store.state.users) App.Store.state.users = {};
    if (!App.Store.state.users[email]) {
      App.Store.state.users[email] = {name, email, createdAt: Date.now()};
    } else if (name) {
      App.Store.state.users[email].name = name;
    }

const XP_LEVELS = [0, 100, 250, 500, 900, 1400, 2000, 2750, 3600, 4600, 5800, 7200];
App.Profile = {
  ensure(pid, name) {
    const P = App.Store.state.profiles;
    if (!P[pid]) P[pid] = {pid, name: name || 'Student', xp: 0, missions: {}, badges: [],
      streak: {count: 0, last: null}, stats: {projects: 0, sims: 0, wires: 0, comps: 0, exports: 0}, createdAt: Date.now()};
    return P[pid];
  },
  get() {
    const c = App.Auth.current();
    if (!c) return null;
    const p = this.ensure(c.pid, c.name);
    if (c.guest) p.guest = true; else p.guest = false;
    return p;
  },
  levelInfo(xp) {
    let idx = 0;
    for (let i = 0; i < XP_LEVELS.length; i++) if (xp >= XP_LEVELS[i]) idx = i;
    const base = XP_LEVELS[idx], next = XP_LEVELS[idx + 1] || null;
    return {level: idx + 1, xp, base, next, into: xp - base,
      span: next ? next - base : 0, pct: next ? Math.min(100, Math.round((xp - base) / (next - base) * 100)) : 100};
  },
  addXP(n, reason) {
    const p = this.get(); if (!p || n <= 0) return;
    const before = this.levelInfo(p.xp).level;
    p.xp += n;
    const after = this.levelInfo(p.xp);
    if (after.level > before) App.UI.toast('Level up — you reached Level ' + after.level + '!', 'gold');
    if (reason) App.notify(reason, 'zap');
    App.Bus.emit('xp', p);
    App.Store.save();
  },
  updateStreak() {
    const p = this.get(); if (!p) return;
    const t = App.today();
    if (p.streak.last === t) return;
    const y = new Date(Date.now() - 864e5);
    const ys = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
    p.streak.count = (p.streak.last === ys) ? p.streak.count + 1 : 1;
    p.streak.last = t;
    App.Store.save();
  }
};

/* ---------- canvas charts ---------- */
App.Charts = {
  prep(canvas, hHint) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || 300, h = hHint || canvas.clientHeight || 160;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return {ctx, w, h};
  },
  line(canvas, tracks, opts) {
    opts = opts || {};
    const {ctx, w, h} = this.prep(canvas, opts.height);
    const padL = 40, padR = 10, padT = 10, padB = 20;
    const n = Math.max.apply(null, tracks.map(t => t.data.length).concat([1]));
    let mn = Infinity, mx = -Infinity;
    tracks.forEach(t => t.data.forEach(v => { if (v < mn) mn = v; if (v > mx) mx = v; }));
    if (!isFinite(mn)) { mn = 0; mx = 1; }
    if (mx - mn < 1e-9) { mx += 1; mn -= 1; }
    const X = i => padL + (w - padL - padR) * (n <= 1 ? 0 : i / (n - 1));
    const Y = v => padT + (h - padT - padB) * (1 - (v - mn) / (mx - mn));
    ctx.font = '10px system-ui'; ctx.fillStyle = '#5C6153';
    // grid + y labels
    for (let g = 0; g <= 4; g++) {
      const v = mn + (mx - mn) * g / 4, y = Y(v);
      ctx.strokeStyle = 'rgba(70,85,43,.12)'; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText((Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1)), 4, y + 3);
    }
    tracks.forEach(t => {
      ctx.strokeStyle = t.color || '#46552B'; ctx.lineWidth = 1.8; ctx.beginPath();
      t.data.forEach((v, i) => { const x = X(i), y = Y(v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
      if (t.fill) {
        ctx.lineTo(X(t.data.length - 1), h - padB); ctx.lineTo(padL, h - padB); ctx.closePath();
        ctx.fillStyle = (t.color || '#46552B') + '22'; ctx.fill();
      }
    });
    if (opts.legend !== false) {
      let lx = padL + 4;
      ctx.font = '10.5px system-ui';
      tracks.forEach(t => {
        ctx.fillStyle = t.color || '#46552B';
        ctx.fillRect(lx, 3, 9, 9);
        ctx.fillStyle = '#303329';
        const label = t.label + (t.unit ? ' (' + t.unit + ')' : '');
        ctx.fillText(label, lx + 13, 11.5);
        lx += 13 + ctx.measureText(label).width + 16;
      });
    }
    if (opts.xlabel) { ctx.fillStyle = '#5C6153'; ctx.textAlign = 'center'; ctx.fillText(opts.xlabel, (padL + w - padR) / 2, h - 5); ctx.textAlign = 'left'; }
    return {mn, mx};
  }
};

<script>
'use strict';
/* ============================================================
   ZIP writer — store-only (no compression), pure JS.
   Produces a valid .zip verified against Info-ZIP `unzip`.
   ============================================================ */
App.Zip = (() => {
  const TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  const crc32 = bytes => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const dosDT = ts => {
    const d = new Date(ts || Date.now());
    const time = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;

    files.forEach(f => {

      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const lh = new Uint8Array(30 + nameB.length);
      const lv = new DataView(lh.buffer);

      lv.setUint16(4, 20, true);      // version needed

      lv.setUint16(28, 0, true);

      cv.setUint16(28, nameB.length, true);
      cv.setUint32(42, offset, true);
      ch.set(nameB, 46);

const CATS = [
  {id: 'power', name: 'Power'}, {id: 'mcu', name: 'Microcontrollers'}, {id: 'basic', name: 'Basic Components'},

/* ---------- geometry ---------- */
E.compDef = c => DEFS[c.key];

E.pinPos = function (c, pin) {
  const d = DEFS[c.key];
  const cx = c.x + d.w / 2, cy = c.y + d.h / 2;
  const dx = pin.x - d.w / 2, dy = pin.y - d.h / 2;
  const r = (c.rot || 0) * Math.PI / 180;
  return {x: cx + dx * Math.cos(r) - dy * Math.sin(r), y: cy + dx * Math.sin(r) + dy * Math.cos(r)};
};
E.findPin = function (c, pid) { return DEFS[c.key].pins.find(p => p.id === pid); };
E.compById = id => E.comps.find(c => c.id === id);

function toWorld(sx, sy) { return {x: (sx - E.view.x) / E.view.s, y: (sy - E.view.y) / E.view.s}; }
function toScreen(wx, wy) { return {x: wx * E.view.s + E.view.x, y: wy * E.view.s + E.view.y}; }
E.snap = v => Math.round(v / E.GRID) * E.GRID;

function compAt(w) {
  for (let i = E.comps.length - 1; i >= 0; i--) {
    const c = E.comps[i], d = DEFS[c.key], ctr = E.center(c);
    const dx = w.x - ctr.x, dy = w.y - ctr.y, r = -(c.rot || 0) * Math.PI / 180;
    const lx = dx * Math.cos(r) - dy * Math.sin(r) + d.w / 2, ly = dx * Math.sin(r) + dy * Math.cos(r) + d.h / 2;
    if (lx >= -6 && ly >= -6 && lx <= d.w + 6 && ly <= d.h + 6) return c;
  }
  return null;
}
function terminalAt(w, maxDist) {
  let best = null, bd = (maxDist || 12) / E.view.s;
  E.comps.forEach(c => DEFS[c.key].pins.forEach(p => {
    const pp = E.pinPos(c, p);
    const dist = Math.hypot(w.x - pp.x, w.y - pp.y);
    if (dist < bd) { bd = dist; best = {c, pin: p}; }
  }));

}
function bezPts(a, b) {
  const pts = [];
  const dx = (b.x - a.x) * 0.45;
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, mt = 1 - t;
    pts.push({
      x: mt*mt*mt*a.x + 3*mt*mt*t*(a.x+dx) + 3*mt*t*t*(b.x-dx) + t*t*t*b.x,
      y: mt*mt*mt*a.y + 3*mt*mt*t*a.y + 3*mt*t*t*b.y + t*t*t*b.y

}

    const b = E.pinPos(E.compById(wd.b.cid), E.findPin(E.compById(wd.b.cid), wd.b.pid));
    for (const p of bezPts(a, b)) if (Math.hypot(w.x - p.x, w.y - p.y) < 9 / E.view.s) return wd;
  }

}

/* ---------- rendering ---------- */
E.drawScene = function (ctx, W, H, data, view, st, opts) {
  opts = opts || {};
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (App.Store.state.settings.showGrid && !opts.noGrid) {
    const step = E.GRID * view.s;
    if (step > 7) {
      ctx.fillStyle = 'rgba(70,85,43,.14)';
      const x0 = ((view.x % step) + step) % step, y0 = ((view.y % step) + step) % step;
      for (let gx = x0; gx < W; gx += step) for (let gy = y0; gy < H; gy += step) ctx.fillRect(gx - .7, gy - .7, 1.6, 1.6);
    }
  }
  ctx.translate(view.x, view.y); ctx.scale(view.s, view.s);
  // wires
  data.wires.forEach(wd => {
    const ca = data.comps.find(c => c.id === wd.a.cid), cb = data.comps.find(c => c.id === wd.b.cid);
    if (!ca || !cb) return;
    const a = App.E.pinPos(ca, App.E.findPin(ca, wd.a.pid));
    const b = App.E.pinPos(cb, App.E.findPin(cb, wd.b.pid));
    const sel = opts.sel && opts.sel.type === 'wire' && opts.sel.id === wd.id;
    const dx = (b.x - a.x) * 0.45;
    ctx.strokeStyle = sel ? '#C5A66A' : (st ? wireColor(wd.id) : '#6E7561');
    ctx.lineWidth = sel ? 3.4 : 2.2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.bezierCurveTo(a.x + dx, a.y, b.x - dx, b.y, b.x, b.y);
    ctx.stroke();
  });
  // wire being drawn
  if (opts.wireDrag && opts.wireDrag.from) {
    const c = App.E.compById(opts.wireDrag.from.cid);
    if (c) {
      const a = App.E.pinPos(c, App.E.findPin(c, opts.wireDrag.from.pid));
      ctx.strokeStyle = '#C5A66A'; ctx.lineWidth = 2.4; ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y);
      ctx.bezierCurveTo(a.x + (opts.wireDrag.pt.x - a.x) * .45, a.y, opts.wireDrag.pt.x - (opts.wireDrag.pt.x - a.x) * .45, opts.wireDrag.pt.y, opts.wireDrag.pt.x, opts.wireDrag.pt.y);
      ctx.stroke(); ctx.setLineDash([]);
    }
  }
  // components
  data.comps.forEach(c => {
    const d = DEFS[c.key];
    ctx.save();
    const ctr = {x: c.x + d.w / 2, y: c.y + d.h / 2};
    ctx.translate(ctr.x, ctr.y); ctx.rotate((c.rot || 0) * Math.PI / 180); ctx.translate(-d.w / 2, -d.h / 2);
    const sel = opts.sel && opts.sel.type === 'comp' && opts.sel.id === c.id;
    if (sel) { ctx.save(); ctx.shadowColor = 'rgba(197,166,106,.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 0; }
    try { d.draw.call(d, ctx, c, st); } catch (e) { /* keep canvas alive */ }
    if (sel) { ctx.restore(); rr(ctx, -5, -5, d.w + 10, d.h + 10, 10); ctx.strokeStyle = '#C5A66A'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore();
  });
  // terminals
  if (!opts.noTerminals) {
    data.comps.forEach(c => DEFS[c.key].pins.forEach(p => {
      const pp = App.E.pinPos(c, p);
      const hov = opts.hover && opts.hover.c.id === c.id && opts.hover.pin.id === p.id;
      ctx.beginPath(); ctx.arc(pp.x, pp.y, hov ? 6.5 : 4.6, 0, 7);
      ctx.fillStyle = hov ? '#C5A66A' : '#F6F0E4'; ctx.fill();
      ctx.strokeStyle = '#303329'; ctx.lineWidth = 1.4; ctx.stroke();
    }));
  }
  // Live guided wire highlights & terminal target halos
  if (App.E.activeExp && !opts.noTerminals) {
    const chk = App.E.lastCheckExp || (App.E.checkExperiment && App.E.checkExperiment());
    if (chk && chk.activeStep && chk.activeStep.type === 'wire') {
      const conn = chk.activeStep.conn;
      const cFrom = chk.activeStep.cFrom;
      const cTo = chk.activeStep.cTo;
      if (cFrom && cTo) {
        const pinA = App.E.findPin(cFrom, conn.from.pin);
        const pinB = App.E.findPin(cTo, conn.to.pin);
        if (pinA && pinB) {
          const pA = App.E.pinPos(cFrom, pinA);
          const pB = App.E.pinPos(cTo, pinB);
          const animT = (App.E.st && App.E.st.animT) ? App.E.st.animT : 0;
          const pulse = Math.sin(animT * 0.12) * 3 + 12;

          ctx.save();
          // Animated wire guidance curve
          const dx = (pB.x - pA.x) * 0.45;
          ctx.beginPath();
          ctx.moveTo(pA.x, pA.y);
          ctx.bezierCurveTo(pA.x + dx, pA.y, pB.x - dx, pB.y, pB.x, pB.y);
          ctx.strokeStyle = '#C5A66A';
          ctx.lineWidth = 2.4;
          ctx.setLineDash([7, 5]);
          ctx.lineDashOffset = -animT * 1.4;
          ctx.stroke();
          ctx.setLineDash([]);

          // Halo A (Start terminal)
          ctx.beginPath();
          ctx.arc(pA.x, pA.y, pulse, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(197,166,106,0.35)';
          ctx.fill();
          ctx.strokeStyle = '#C5A66A';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Halo B (Target terminal)
          ctx.beginPath();
          ctx.arc(pB.x, pB.y, pulse, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(70,85,43,0.35)';
          ctx.fill();
          ctx.strokeStyle = '#46552B';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Pin labels
          const drawTag = (txt, pt, bg, col, yOff) => {
            ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
            const tw = ctx.measureText(txt).width;
            const bw = tw + 14, bh = 22;
            const bx = pt.x - bw / 2, by = pt.y + yOff;
            ctx.fillStyle = bg;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 6);
            else ctx.rect(bx, by, bw, bh);
            ctx.fill();
            ctx.strokeStyle = col;
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.fillStyle = col;
            ctx.textAlign = 'center';
            ctx.fillText(txt, pt.x, by + 15);
          };

          drawTag('1. WIRE: ' + (conn.from.label || pinA.label), pA, 'rgba(48,51,41,0.92)', '#F6F0E4', -34);
          drawTag('2. TO: ' + (conn.to.label || pinB.label), pB, 'rgba(46,85,43,0.92)', '#F6F0E4', 16);
          ctx.restore();
        }
      }
    }
  }
  // armed ghost preview
  if (opts.armed && opts.mouse && opts.mouse.inside) {
    const d = DEFS[opts.armed];
    const gx = App.E.snap(opts.mouse.x - d.w / 2), gy = App.E.snap(opts.mouse.y - d.h / 2);
    ctx.globalAlpha = .5;
    try { d.draw.call(d, ctx, {id: '_ghost', key: opts.armed, x: gx, y: gy, rot: 0, props: JSON.parse(JSON.stringify(d.props || {}))}, null); } catch (e) {}
    ctx.globalAlpha = 1;
