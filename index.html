    const sel = E.sel;
    let html = '';
    if (!sel) {
      html = `<div class="tiny muted" style="margin-bottom:10px">Nothing selected. Click a component or wire on the canvas.</div>
        <div class="expt"><b>Quick tips</b><br>\u2022 Drag from the library, or click an item then click the canvas.<br>
        \u2022 Drag <b>terminal \u2192 terminal</b> to wire.<br>
        \u2022 <kbd>R</kbd> rotates · <kbd>Del</kbd> deletes · drag empty space to pan · pinch / wheel to zoom.<br>
        \u2022 In Simulate mode, click buttons & switches to interact.</div>
        <div class="insp-row"><span class="k">Components</span><b>${E.comps.length}</b></div>
        <div class="insp-row"><span class="k">Wires</span><b>${E.wires.length}</b></div>
        <div class="insp-row"><span class="k">Mode</span><b>${E.mode === 'sim' ? 'Simulate (digital)' : 'Edit'}</b></div>`;
    } else if (sel.type === 'wire') {
      const w = E.wires.find(x => x.id === sel.id);
      if (w) {
        const ca = E.compById(w.a.cid), cb = E.compById(w.b.cid);
        html = `<h3 style="font-size:15px">Wire</h3>
          <div class="insp-row"><span class="k">From</span><b>${ca ? App.esc(ca.label || DEFS[ca.key].name) + ' \u00B7 ' + w.a.pid : '?'}</b></div>
          <div class="insp-row"><span class="k">To</span><b>${cb ? App.esc(cb.label || DEFS[cb.key].name) + ' \u00B7 ' + w.b.pid : '?'}</b></div>
          <div class="btn-row" style="margin-top:10px"><button class="btn sm danger" id="i-del">${App.I('trash', 13)} Delete wire</button></div>`;
      }
    } else {
      const c = E.compById(sel.id);
      if (c) {
        const d = DEFS[c.key];
        const live = E.mode === 'sim' ? E.simStates : null;
        let liveInfo = '';
        if (live && c.key === 'led') liveInfo = `<div class="insp-row"><span class="k">State</span><span class="state-pill ${live.leds[c.id] ? 'on' : ''}">${live.leds[c.id] ? 'LIT' : 'OFF'}</span></div>`;
        if (live && c.key === 'motor') liveInfo = `<div class="insp-row"><span class="k">State</span><span class="state-pill ${live.motors[c.id] ? 'on' : ''}">${live.motors[c.id] ? 'SPINNING' : 'STOPPED'}</span></div>`;
        let propCtl = '';
        if (c.key === 'res') propCtl = `<div class="insp-row"><span class="k">Resistance</span><select class="input" data-prop="value" style="width:110px;padding:5px 8px">${d.values.map(v => `<option ${c.props.value === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
        if (c.key === 'cap') propCtl = `<div class="insp-row"><span class="k">Capacitance</span><select class="input" data-prop="value" style="width:110px;padding:5px 8px">${d.values.map(v => `<option ${c.props.value === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div class="tiny muted" style="margin-top:6px">${App.esc(d.props.note || '')}</div>`;
        if (c.key === 'led') propCtl = `<div class="insp-row"><span class="k">Colour</span><select class="input" data-prop="color" style="width:110px;padding:5px 8px">${Object.keys(d.colors).map(v => `<option ${c.props.color === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
        if (c.key === 'sw') propCtl = `<div class="insp-row"><span class="k">Closed</span><button class="toggle ${c.props.closed ? 'on' : ''}" data-tog="closed"></button></div>`;
        if (c.key === 'ldr') propCtl = `<div class="insp-row"><span class="k">Light detected</span><button class="toggle ${c.props.active ? 'on' : ''}" data-tog="active"></button></div>`;
        if (c.key === 'btn') propCtl = `<div class="insp-row"><span class="k">Momentary</span><button class="toggle ${c.props.momentary !== false ? 'on' : ''}" data-tog="momentary"></button></div>
          <div class="tiny muted">Momentary: pressed while pointer is down. Latching: click toggles.</div>`;
        if (c.key === 'servo') propCtl = `<div class="insp-row"><span class="k">Angle</span><b>${c.props.angle}\u00B0</b></div><input type="range" min="0" max="180" value="${c.props.angle}" data-prop="angle">`;
        if (c.key === 'ic555') propCtl = `<div class="insp-row"><span class="k">Frequency</span><select class="input" data-prop="freq" style="width:110px;padding:5px 8px">${d.freqs.map(v => `<option ${c.props.freq === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`;
        html = `<h3 style="font-size:15px">${App.esc(d.name)}</h3>
          <div class="insp-row"><span class="k">Label</span><input class="input" data-prop="label" value="${App.esc(c.label || '')}" style="width:140px;padding:5px 8px"></div>
          ${liveInfo}${propCtl}
          <div class="insp-row"><span class="k">Terminals</span>${d.pins.map(p => p.label).join(' · ')}</div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn sm ghost" id="i-rot">${App.I('rotate', 13)} Rotate</button>
            <button class="btn sm danger" id="i-del">${App.I('trash', 13)} Delete</button>
          </div>`;
      }
    }
    body.innerHTML = html;
    // bind inspector controls
    App.$$('[data-prop]', body).forEach(el => el.addEventListener('input', e => {
      const c = E.compById(E.sel.id); if (!c) return;
      const p = el.dataset.prop;
      if (p === 'label') c.label = el.value;
      else if (p === 'angle') c.props.angle = +el.value;
      else c.props[p] = el.value;
      E.markDirty();
      if (p === 'angle' || p === 'label') E.renderInspector();
    }));
    App.$$('[data-tog]', body).forEach(el => el.addEventListener('click', () => {
      const c = E.compById(E.sel.id); if (!c) return;
      const k = el.dataset.tog;
      c.props[k] = el.classList.contains('on') ? false : (k === 'momentary' ? true : !c.props[k]);
      E.markDirty(); E.renderInspector();
    }));
    const rot = body.querySelector('#i-rot'); if (rot) rot.addEventListener('click', E.rotateSel);
    const del = body.querySelector('#i-del'); if (del) del.addEventListener('click', E.deleteSel);
  };
  E.renderPins = function () {
    const body = document.getElementById('epanel-body');
    if (!body || body.dataset.tab !== 'pins') return;
    const unos = E.comps.filter(c => c.key === 'arduino');
    if (!unos.length) { body.innerHTML = '<div class="tiny muted">Place an Arduino Uno to configure its digital pins.</div>'; return; }
    let html = `<div class="btn-row" style="margin-bottom:10px">
      <button class="btn sm gold" id="pre-blink">Blink D13</button>
      <button class="btn sm ghost" id="pre-btn">Button input D2</button>
      <button class="btn sm ghost" id="pre-clr">Clear modes</button></div>`;
    unos.forEach(c => {
      html += `<div class="lib-cat" style="margin-top:8px">${App.esc(c.label || 'Arduino Uno')} \u2014 ${c.id.slice(-4)}</div>`;
      ['D2','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12','D13'].forEach(pid => {
        const m = (E.pinModes[c.id] = E.pinModes[c.id] || {})[pid] = E.pinModes[c.id][pid] || {mode: 'off', state: 'LOW', blink: false, period: 1000};
        const live = E.mode === 'sim' ? (E.simStates.pins[c.id + ':' + pid] || '') : '';
        html += `<div class="pin-row"><b>${pid}</b>
          <select class="input" data-pin="${c.id}|${pid}|mode" style="padding:4px 6px;font-size:11px">
            <option value="off" ${m.mode === 'off' ? 'selected' : ''}>off</option>
            <option value="input" ${m.mode === 'input' ? 'selected' : ''}>INPUT</option>
            <option value="output" ${m.mode === 'output' ? 'selected' : ''}>OUTPUT</option>
          </select>
          <span>${m.mode === 'output' ? `<button class="state-pill ${m.state === 'HIGH' ? 'high' : ''}" data-pin="${c.id}|${pid}|state">${m.state}</button>
            <label class="check tiny" style="margin-left:6px"><input type="checkbox" data-pin="${c.id}|${pid}|blink" ${m.blink ? 'checked' : ''}>blink</label>` :
            m.mode === 'input' ? `<span class="state-pill ${live === 'HIGH' ? 'high' : ''}">${live || m.state}</span>` : '<span class="tiny muted">\u2014</span>'}</span></div>`;
      });
    });
    body.innerHTML = html;
    body.onchange = e => {
      const t = e.target.dataset.pin; if (!t) return;
      const [cid, pid, what] = t.split('|');
      const m = E.pinModes[cid][pid];
      if (what === 'mode') m.mode = e.target.value;
      if (what === 'blink') m.blink = e.target.checked;
      E.renderPins(); App.Store.save();
    };
    body.onclick = e => {
      const t = e.target.dataset && e.target.dataset.pin;
      if (t && t.endsWith('|state')) {
        const [cid, pid] = t.split('|');
        const m = E.pinModes[cid][pid];
        m.state = m.state === 'HIGH' ? 'LOW' : 'HIGH';
        E.renderPins(); App.Store.save();
      }
    };
    const pb = document.getElementById('pre-blink');
    if (pb) pb.addEventListener('click', () => {
      const u = E.comps.find(c => c.key === 'arduino'); if (!u) { App.UI.toast('Place an Arduino Uno first.', 'warn'); return; }
      E.pinModes[u.id] = E.pinModes[u.id] || {};
      E.pinModes[u.id].D13 = {mode: 'output', state: 'HIGH', blink: true, period: 1000};
      E.renderPins(); App.UI.toast('Preset applied: D13 blinks at 1 Hz. Press Run, then open Mission Control to watch the waveform.');
    });
    const qb = document.getElementById('pre-btn');
    if (qb) qb.addEventListener('click', () => {
      const u = E.comps.find(c => c.key === 'arduino'); if (!u) { App.UI.toast('Place an Arduino Uno first.', 'warn'); return; }
      E.pinModes[u.id] = E.pinModes[u.id] || {};
      E.pinModes[u.id].D2 = {mode: 'input', state: 'LOW', blink: false};
      E.renderPins(); App.UI.toast('Preset applied: D2 reads INPUT. Wire 5V \u2192 push button \u2192 D2.');
    });
    const cb = document.getElementById('pre-clr');
    if (cb) cb.addEventListener('click', () => { E.pinModes = {}; E.renderPins(); });
  };
  E.renderLog = function () {
    const body = document.getElementById('epanel-body');
    if (!body || body.dataset.tab !== 'log') return;
    const logs = E.sim.log.slice(-80).reverse();
    body.innerHTML = (logs.length ? logs.map(l => '<div class="log-line"><span class="t">' + new Date(l.t).toLocaleTimeString() + '</span>' + App.esc(l.msg) + '</div>').join('') : '<div class="tiny muted">No simulation events yet. Press Run to start the digital simulation.</div>');
  };
  E.renderIssues = function () {
    const body = document.getElementById('epanel-body');
    if (!body || body.dataset.tab !== 'issues') return;
    const icons = {error: 'alert', warn: 'alert', info: 'check'};
    body.innerHTML = (E.issues.length ? E.issues.map(i => `<div class="issue ${i.sev}">${App.I(icons[i.sev], 14)}<span>${App.esc(i.msg)}</span></div>`).join('')
      : '<div class="issue info">' + App.I('check', 14) + '<span>No issues detected. Validation checks shorts, unconnected legs, missing series resistors and driver conflicts.</span></div>');
  };
})();

</script>
<script>
'use strict';
/* ============================================================
   LAB 02 — AEROSPACE LAB
   Satellite power · Rocket avionics · Drone/UAV · Aircraft
   All values are SIMULATED educational models.
   ============================================================ */
App.A = {
  tab: 'sat',
  sat: {running: false, timer: null, t: 0, orbits: 0, cfg: {alt: 500, eff: 0.28, load: 2.0, battWh: 40, source: 'default'}, E: 40, hist: {soc: [], volt: [], temp: []}, events: []},
  rocket: {phase: 'IDLE', t: 0, h: 0, v: 0, prop: 52, thrust: 0, qMax: 0, qMaxAt: 0, timer: null, countdown: 10, events: [], hist: {alt: [], vel: [], acc: []}, fired: {}},
  drone: {running: false, timer: null, t: 0, alt: 0, batt: 100, roll: 0, pitch: 0, throttle: 55, trimRoll: 0, trimPitch: 0, stabilize: true, hist: {alt: [], batt: [], roll: [], pitch: [], motor: []}},
  air: {spd: 90, pitch: 2, bank: 0, hdg: 45, lowBatt: false},
  _timers: []
};
const A = App.A;

/* ---------- shared ---------- */
A.clearTimers = function () { A._timers.forEach(t => clearInterval(t)); A._timers = []; };
A.every = function (ms, fn) { const t = setInterval(fn, ms); A._timers.push(t); return t; };
A.pushCapped = (arr, v, cap) => { arr.push(v); if (arr.length > cap) arr.shift(); };

/* ================= SATELLITE POWER SYSTEMS ================= */
A.satPeriod = function () { // Kepler, real physics for period (s)
  const R = 6371, mu = 398600;
  const a = R + A.sat.cfg.alt;
  return 2 * Math.PI * Math.sqrt(a * a * a / mu);
};
A.satTick = function () {
  const s = A.sat, c = s.cfg;
  const T = A.satPeriod();
  const dt = 60; // 1 real tick = 60 s of orbit time (time compression, labelled)
  s.t += dt;
  const theta = (2 * Math.PI * s.t) / T;
  const sun = Math.sin(theta) > 0 ? 1 : 0;                 // simplified eclipse model
  const pIn = sun ? 1361 * 0.02 * c.eff * 4 : 0;           // 4 faces × 0.02 m² panels
  const pNet = pIn * 0.85 - c.load;                        // charge controller loss modelled
  s.E = App.clamp(s.E + (pNet * dt) / 3600, 0, c.battWh);
  const soc = (s.E / c.battWh) * 100;
  const volt = 6 * 3.3 + 6 * 0.9 * (soc / 100);            // 6-cell pack model
  const temp = -20 + 55 * sun + Math.sin(s.t / 600) * 2;
  A.pushCapped(s.hist.soc, soc, 360);
  A.pushCapped(s.hist.volt, volt, 360);
  A.pushCapped(s.hist.temp, temp, 360);
  const orbitN = Math.floor(s.t / T);
  if (orbitN > s.orbits) { s.orbits = orbitN; s.events.push({t: Date.now(), msg: 'Orbit ' + orbitN + ' completed (simulated).'}); }
  if (s.t >= T && !s._orbitBumped) { s._orbitBumped = true; App.Missions.bump('orbitRun'); }
  if (soc <= 0) s.events.push({t: Date.now(), msg: 'Battery depleted — load shedding required (simulated).'});
  A.renderSat();
};
A.satReset = function () {
  const s = A.sat;
  s.t = 0; s.orbits = 0; s.E = s.cfg.battWh; s._orbitBumped = false;
  s.hist = {soc: [], volt: [], temp: []}; s.events = [];
  A.renderSat();
};
A.satStop = function () {
  if (A.sat.t > 0 && A.sat.hist.soc.length > 3 && App.SimLab) {
    App.SimLab.record({id: App.uid('s'), type: 'satellite', name: 'CubeSat power run (' + A.sat.cfg.alt + ' km)', startedAt: Date.now() - A.sat.hist.soc.length * 1000, rate: 1,
      dur: A.sat.hist.soc.length, tracks: [
        {label: 'Battery SoC', kind: 'analog', color: '#46552B', unit: '%', data: A.sat.hist.soc.slice()},
        {label: 'Bus voltage', kind: 'analog', color: '#C5A66A', unit: 'V', data: A.sat.hist.volt.slice()},
        {label: 'Temperature', kind: 'analog', color: '#93402F', unit: '\u00B0C', data: A.sat.hist.temp.slice()}
      ], events: A.sat.events.slice(-100), meta: {cfg: {...A.sat.cfg}, note: 'SIMULATED telemetry — educational model, 60\u00D7 time compression'}});
    App.UI.toast('Satellite run sent to Mission Control.');
  }
};
A.circuitCompat = function () {
  const pid = App.Store.state.ui.activeProjectId;
  const pr = pid && App.Store.state.projects.find(p => p.id === pid);
  const el = pr && pr.data && pr.data.electronics;
  const comps = (el && el.comps) || [];
  const hasBatt = comps.some(c => c.key === 'bat9' || c.key === 'src5');
  const hasSensor = comps.some(c => c.key === 'ldr');
  return {pr, comps: comps.length, hasBatt, hasSensor, ok: hasBatt && hasSensor && comps.length > 2};
};

/* ================= ROCKET AVIONICS ================= */
A.rocketReset = function () {
  const r = A.rocket;
  clearInterval(r.timer);
  A._timers = A._timers.filter(t => t !== r.timer);
  Object.assign(r, {phase: 'IDLE', t: 0, h: 0, v: 0, prop: 52, thrust: 0, qMax: 0, qMaxAt: 0, countdown: 10, events: [], hist: {alt: [], vel: [], acc: []}, fired: {}});
  A.renderRocket();
};
A.rocketEvent = function (msg) {
  A.rocket.events.push({t: A.rocket.t, msg});
  A.renderRocket(true);
};
A.rocketStart = function () {
  const r = A.rocket;
  if (r.phase !== 'IDLE') return;
  r.phase = 'COUNTDOWN';
  const skip = document.getElementById('rk-skip') && document.getElementById('rk-skip').checked;
  if (skip) { r.countdown = 0.4; }
  r.timer = A.every(100, () => A.rocketTick());
  A.rocketEvent('Countdown initiated (SIMULATED).');
};
A.rocketAbort = function () {
  const r = A.rocket;
  if (r.phase === 'IDLE') return;
  clearInterval(r.timer);
  A._timers = A._timers.filter(t => t !== r.timer);
  r.thrust = 0;
  A.rocketEvent('ABORT — engine cutoff commanded. Telemetry frozen.');
  if (r.hist.alt.length > 3) A.rocketRecord();
  r.phase = 'IDLE';
  A.renderRocket();
};
A.rocketRecord = function () {
  const r = A.rocket;
  if (App.SimLab) App.SimLab.record({id: App.uid('s'), type: 'rocket', name: 'Rocket launch — apogee ' + (r.hist.alt.length ? Math.max.apply(null, r.hist.alt).toFixed(0) : 0) + ' m', startedAt: Date.now(), rate: 10,
    dur: r.t, tracks: [
      {label: 'Altitude', kind: 'analog', color: '#46552B', unit: 'm', data: r.hist.alt.slice()},
      {label: 'Velocity', kind: 'analog', color: '#C5A66A', unit: 'm/s', data: r.hist.vel.slice()}
    ], events: r.events.map(e => ({t: e.t * 1000, msg: 'T+' + e.t.toFixed(1) + 's \u00B7 ' + e.msg})), meta: {note: 'SIMULATED flight model \u2014 1D point-mass physics, not a certified trajectory'}});
  App.UI.toast('Launch telemetry sent to Mission Control.');
};
A.rocketTick = function () {
  const r = A.rocket;
  const dt = 0.1;
  if (r.phase === 'COUNTDOWN') {
    r.countdown -= dt;
    if (Math.abs(r.countdown - Math.round(r.countdown)) < dt / 2 && r.countdown > 0 && Math.round(r.countdown) % 1 === 0) {
      const n = Math.ceil(r.countdown);
      if (n !== r._lastN) { r._lastN = n; if (n <= 5) A.rocketEvent('T\u2212' + n + '\u2026'); }
    }
    if (r.countdown <= 0) { r.phase = 'BURN'; r.thrust = 1500; A.rocketEvent('IGNITION & LIFTOFF.'); }
    A.renderRocket();
    return;
  }
  r.t += dt;
  const m = 28 + r.prop;
  const g = 9.81;
  const rho = 1.225 * Math.exp(-r.h / 8500);
  const q = 0.5 * rho * r.v * r.v;
  const drag = q * 0.0055;
  const acc = (r.thrust - drag) / m - g;
  r.v = Math.max(0, r.v + acc * dt) ; // simplified: no downward descent integration once landed
  if (r.phase !== 'LAND') { r.h += r.v * dt; }
  if (r.phase === 'BURN') {
    r.prop = Math.max(0, r.prop - 52 / 45 * dt);
    if (r.prop <= 0) { r.thrust = 0; r.phase = 'COAST'; A.rocketEvent('MECO — main engine cutoff.'); }
    if (q > r.qMax) { r.qMax = q; r.qMaxAt = r.t; }
    if (r.phase === 'BURN' && r.qMax > 2000 && q < r.qMax * 0.9 && !r.fired.maxq) { r.fired.maxq = true; A.rocketEvent('Max-Q passed (' + (r.qMax / 1000).toFixed(1) + ' kPa, T+' + r.qMaxAt.toFixed(0) + 's).'); }
  }
  if (r.phase === 'COAST' && r.v < 0.4 && r.t > 2) { r.phase = 'APOGEE'; A.rocketEvent('APOGEE at ' + r.h.toFixed(0) + ' m. Deploying dummy chute (simulated).'); r.phase = 'DESCENT'; }
  if (r.phase === 'DESCENT') {
    // Parachute descent is time-compressed 100x so the lesson stays interactive — clearly noted in the event log.
    const dts = dt * 100;
    const vTarget = r.h < 1500 ? 6.5 : 40; // drogue 40 m/s high up, main chute 6.5 m/s low down
    r.v = -vTarget;
    if (!r.fired.drogue) { r.fired.drogue = true; A.rocketEvent('Drogue parachute deployed \u2014 descent time-compressed 100\u00D7 (simulated).'); }
    if (r.h < 1500 && !r.fired.main) { r.fired.main = true; A.rocketEvent('Main parachute deployed (simulated).'); }
    r.h -= vTarget * dts;
    if (r.h <= 0) {
      r.h = 0; r.v = 0; r.phase = 'LAND';
      A.rocketEvent('TOUCHDOWN. Flight complete.');
      App.Missions.bump('launchDone');
      A.rocketRecord();
      clearInterval(r.timer);
      A._timers = A._timers.filter(t => t !== r.timer);
      r.phase = 'IDLE';
    }
  }
  A.pushCapped(r.hist.alt, r.h, 3000);
  A.pushCapped(r.hist.vel, r.v, 3000);
  A.pushCapped(r.hist.acc, Math.max(0, acc), 3000);
  A.renderRocket();
};

/* ================= DRONE / UAV ================= */
A.droneTick = function () {
  const d = A.drone;
  d.t += 0.1;
  const thr = d.throttle;
  const targetAlt = App.clamp((thr - 55) * 4, 0, 120);
  d.alt += (targetAlt - d.alt) * 0.06;
  d.batt = Math.max(0, d.batt - (0.05 + thr / 1200) * 0.1);
  const stab = d.stabilize ? 0 : 1;
  const tr = d.trimRoll * stab, tp = d.trimPitch * stab;
  d.roll += ((tr + (Math.random() - 0.5) * (d.stabilize ? 1.6 : 5)) - d.roll) * 0.15;
  d.pitch += ((tp + (Math.random() - 0.5) * (d.stabilize ? 1.6 : 5)) - d.pitch) * 0.15;
  const corr = d.stabilize ? (Math.abs(d.roll) + Math.abs(d.pitch)) * 0.12 : 0;
  d.motorAvg = App.clamp(thr + corr, 0, 100);
  A.pushCapped(d.hist.alt, d.alt, 300);
  A.pushCapped(d.hist.batt, d.batt, 300);
  A.pushCapped(d.hist.roll, d.roll, 300);
  A.pushCapped(d.hist.pitch, d.pitch, 300);
  A.pushCapped(d.hist.motor, d.motorAvg, 300);
  App.Missions.bump('droneSeconds', 1);
  A.renderDrone();
};
A.droneStartStop = function () {
  const d = A.drone;
  if (d.running) {
    clearInterval(d.timer); A._timers = A._timers.filter(t => t !== d.timer);
    d.running = false;
    if (d.hist.alt.length > 3 && App.SimLab) {
      App.SimLab.record({id: App.uid('s'), type: 'drone', name: 'Drone hover telemetry (' + Math.round(d.t) + ' s)', startedAt: Date.now(), rate: 10, dur: d.t,
        tracks: [
          {label: 'Altitude', kind: 'analog', color: '#46552B', unit: 'm', data: d.hist.alt.slice()},
          {label: 'Battery', kind: 'analog', color: '#C5A66A', unit: '%', data: d.hist.batt.slice()},
          {label: 'Roll', kind: 'analog', color: '#89966B', unit: '\u00B0', data: d.hist.roll.slice()},
          {label: 'Pitch', kind: 'analog', color: '#93402F', unit: '\u00B0', data: d.hist.pitch.slice()}
        ], events: [], meta: {note: 'SIMULATED sensor stream \u2014 educational flight-controller model'}});
      App.UI.toast('Drone telemetry sent to Mission Control.');
    }
  } else {
    d.running = true;
    d.timer = A.every(100, A.droneTick);
  }
  const btn = document.getElementById('dr-run');
  if (btn) btn.innerHTML = d.running ? App.I('pause', 13) + ' Pause' : App.I('play', 13) + ' Start stream';
};

/* ================= AIRCRAFT INSTRUMENTS ================= */
A.airDraw = function () {
  const cv = document.getElementById('air-cv');
  if (!cv) return;
  const ctx0 = App.Charts.prep(cv, 300);
  const ctx = ctx0.ctx, W = ctx0.w, H = ctx0.h;
  const a = A.air;
  const vsi = a.pitch * a.spd * 3.2;
  ctx.fillStyle = '#FDFBF6'; ctx.fillRect(0, 0, W, H);
  const cx = W / 6, cy = H / 4;
  const dial = (x, y, r, title) => {
    ctx.strokeStyle = '#303329'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.stroke();
    ctx.font = '9px system-ui'; ctx.fillStyle = '#5C6153'; ctx.textAlign = 'center';
    ctx.fillText(title, x, y + r + 12);
    ctx.textAlign = 'left';
  };
  const needle = (x, y, ang, len, col, wdt) => {
    ctx.strokeStyle = col || '#303329'; ctx.lineWidth = wdt || 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(ang) * len, y - Math.cos(ang) * len); ctx.stroke(); ctx.lineCap = 'butt';
  };
  // ASI
  dial(cx, cy, 34, 'AIRSPEED kt');
  for (let i = 0; i <= 8; i++) needle(cx, cy, (i / 8) * Math.PI * 1.5 - Math.PI * 0.75, 30, '#89966B', 1);
  needle(cx, cy, App.clamp(a.spd / 180, 0, 1) * Math.PI * 1.5 - Math.PI * 0.75, 24, '#93402F', 3);
  // attitude
  const ax = cx + W / 6, ay = cy;
  dial(ax, ay, 34, 'ATTITUDE');
  ctx.save(); ctx.beginPath(); ctx.arc(ax, ay, 32, 0, 7); ctx.clip();
  ctx.translate(ax, ay); ctx.rotate(-a.bank * Math.PI / 180);
  const po = a.pitch * 1.6;
  ctx.fillStyle = '#89966B'; ctx.fillRect(-60, -60 + po, 120, 60);
  ctx.fillStyle = '#DED1B9'; ctx.fillRect(-60, po, 120, 60);
  ctx.strokeStyle = '#303329'; ctx.beginPath(); ctx.moveTo(-60, po); ctx.lineTo(60, po); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#C5A66A'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ax - 12, ay); ctx.lineTo(ax - 4, ay); ctx.moveTo(ax + 4, ay); ctx.lineTo(ax + 12, ay); ctx.stroke();
  // altimeter
  const alx = cx + W / 3, aly = cy;
  dial(alx, aly, 34, 'ALTITUDE (sim)');
  needle(alx, aly, (A.airAlt % 1000) / 1000 * Math.PI * 2, 24, '#303329', 2.5);
  needle(alx, aly, (A.airAlt % 10000) / 10000 * Math.PI * 2, 16, '#46552B', 4);
  // turn
  const tx = cx, ty = cy + H / 2;
  dial(tx, ty, 34, 'TURN COORD.');
  ctx.save(); ctx.translate(tx, ty);
  ctx.fillStyle = '#303329'; ctx.beginPath(); ctx.arc(0, 8 + Math.sin(a.bank * Math.PI / 180) * 14, 5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#89966B'; ctx.beginPath(); ctx.moveTo(-26, 6); ctx.lineTo(26, 6); ctx.stroke();
  ctx.restore();
  // heading
  const hx = cx + W / 6, hy = cy + H / 2;
  dial(hx, hy, 34, 'HEADING');
  ctx.font = '8px system-ui'; ctx.fillStyle = '#303329'; ctx.textAlign = 'center';
  ['N','E','S','W'].forEach((cc, i) => {
    const ang = i * Math.PI / 2 - a.hdg * Math.PI / 180;
    ctx.fillText(cc, hx + Math.sin(ang) * 24, hy - Math.cos(ang) * 24 + 3);
  });
  ctx.textAlign = 'left';
  needle(hx, hy, 0, 26, '#C5A66A', 3);
  // VSI
  const vx = cx + W / 3, vy = cy + H / 2;
  dial(vx, vy, 34, 'VSI fpm');
  needle(vx, vy, App.clamp(vsi / 2000, -1, 1) * Math.PI * 0.75, 24, '#46552B', 3);
  // annunciators
  const ann = document.getElementById('air-ann');
  if (ann) {
    ann.innerHTML = '<span class="ann ' + (a.spd < 45 ? 'lit' : '') + '">STALL</span>'
      + '<span class="ann ' + (a.spd > 150 ? 'lit' : '') + '">OVERSPEED</span>'
      + '<span class="ann gold ' + (a.lowBatt ? 'lit' : '') + '">LOW BATT</span>'
      + '<span class="ann">NAV</span><span class="ann">XPDR</span>';
  }
};
A.airAlt = 2500;
A.airTick = function () { A.airAlt = App.clamp(A.airAlt + A.air.pitch * A.air.spd * 3.2 / 60, 0, 12000); A.airDraw(); const el = document.getElementById('air-altv'); if (el) el.textContent = Math.round(A.airAlt) + ' ft'; };

      <button data-t="air">${App.I('send', 15)} Aircraft Systems</button>

    </div>
    <div id="aero-body"></div>
    <div class="sim-tag" style="margin-top:14px">${App.I('alert', 12)} Educational simulations — every value on this page is simulated, not a real hardware reading</div>`;
  },
  mount() {
    A.clearTimers();
    document.getElementById('aero-tabs').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      A.tab = b.dataset.t;
      App.$$('#aero-tabs button').forEach(x => x.classList.toggle('active', x === b));
      A.renderTab();
    });
    A.renderTab();
  },
  cleanup() { A.clearTimers(); }
};
A.renderTab = function () {
  const body = document.getElementById('aero-body');
  if (!body) return;
  ({sat: A.tabSat, rk: A.tabRocket, dr: A.tabDrone, air: A.tabAir, '3d': A.tab3D})[A.tab](body);
};

</script>
<script>
'use strict';
/* ============================================================
   LAB 02 — AEROSPACE LAB · Part 2: tab renderers + 3D viewer

(function () {

  /* ================= SATELLITE TAB ================= */

          <div class="spread"><h3>${App.I('satellite', 16)} CubeSat Power Simulator</h3><span class="sim-tag">Simulated · 60\u00D7 time</span></div>
          <p class="small muted">A 3U CubeSat electrical power system: solar panels charge a battery bus under a simplified eclipse cycle. Kepler's third law gives a real orbital period for the chosen altitude.</p>

    const link = document.getElementById('s-link');

  };
  function T2(alt) { const R = 6371, mu = 398600; const a = R + alt; return 2 * Math.PI * Math.sqrt(a * a * a / mu); }
  function bindSliders(list) {
    list.forEach(([id, fn]) => { const el = document.getElementById(id); if (el) el.addEventListener('input', e => fn(e.target.value)); });
  }
  A.renderSat = function () {
    const s = A.sat, h = s.hist;
    if (!document.getElementById('g-soc')) return;
    const soc = h.soc.length ? h.soc[h.soc.length - 1] : 100;
    const volt = h.volt.length ? h.volt[h.volt.length - 1] : 24;
    const temp = h.temp.length ? h.temp[h.temp.length - 1] : 35;
    const T = T2(s.cfg.alt);
    const sun = Math.sin(2 * Math.PI * s.t / T) > 0;
    document.getElementById('g-soc').textContent = soc.toFixed(0) + '%';
    document.getElementById('g-volt').textContent = volt.toFixed(1) + ' V';
    document.getElementById('g-temp').textContent = (temp >= 0 ? '+' : '') + temp.toFixed(0) + '\u00B0C';
    document.getElementById('g-sun').textContent = sun ? 'SUN' : 'ECLIPSE';
    App.Charts.line(document.getElementById('s-chart1'), [{label: 'Battery SoC', color: '#46552B', data: h.soc, fill: true}], {height: 150, xlabel: 'time (1 pt = 1 min sim)'});
    App.Charts.line(document.getElementById('s-chart2'), [{label: 'Bus voltage', color: '#C5A66A', data: h.volt}, {label: 'Temp \u00B0C', color: '#93402F', data: h.temp}], {height: 150});
  };

  /* ================= ROCKET TAB ================= */
  A.tabRocket = function (body) {
    const r = A.rocket;
    body.innerHTML = `
    <div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)">
      <div class="stack">
        <div class="card">
          <div class="spread"><h3>${App.I('rocket', 16)} Launch Sequence Simulator</h3><span class="sim-tag">Simulated flight model</span></div>
          <p class="small muted">A 1D point-mass flight computer: 80 kg sounding rocket, 1500 N thrust, 45 s burn, exponential-atmosphere drag. The sequence, staging and callouts mimic a real avionics state machine.</p>
          <label class="check" style="margin-bottom:10px"><input type="checkbox" id="rk-skip"> Skip countdown (start at T\u22120.4 s)</label>
          <div class="btn-row"><button class="btn sm primary" id="rk-start">${App.I('play', 13)} Start countdown</button>
            <button class="btn sm danger" id="rk-abort">${App.I('alert', 13)} Abort</button>

            <div class="gauge"><div class="gv" id="g-rk-h">0 m</div><div class="gk">Altitude</div></div>
            <div class="gauge"><div class="gv" id="g-rk-v">0 m/s</div><div class="gk">Velocity</div></div>
            <div class="gauge"><div class="gv" id="g-rk-a">0.0 g</div><div class="gk">Accel</div></div>
            <div class="gauge"><div class="gv" id="g-rk-p">52 kg</div><div class="gk">Propellant</div></div>
            <div class="gauge"><div class="gv" id="g-rk-q">0.0 kPa</div><div class="gk">Dyn. pressure</div></div>

        <div class="card"><h3>${App.I('activity', 16)} Flight telemetry</h3>
          <canvas id="rk-chart2" style="width:100%;height:160px"></canvas></div>

      <div class="stack">

        <div class="card"><h3>${App.I('clock', 16)} Event log</h3><div id="rk-log" style="max-height:170px;overflow:auto">${r.events.slice().reverse().map(e => '<div class="log-line"><span class="t">T+' + e.t.toFixed(1) + 's</span>' + App.esc(e.msg) + '</div>').join('') || '<span class="tiny muted">Awaiting launch\u2026</span>'}</div></div>
        ${CONCEPT('Flight computer', 'The avionics stack reads IMU + barometer, runs the guidance state machine and fires events: ignition, liftoff detection, Max-Q, MECO, apogee, deployment, touchdown.')}
        ${CONCEPT('Altitude & temperature sensing', 'Barometric pressure gives altitude; thermistors watch motor-case and avionics-bay temperatures. In this simulator both are computed from the flight model.')}
        ${CONCEPT('Telemetry downlink', 'Rocket and ground speak over radio link (e.g. 433 MHz / 2.4 GHz). Mission Control plots altitude & velocity like the waveform viewer in Lab 03.')}
      </div>
    </div>`;
    document.getElementById('rk-start').addEventListener('click', A.rocketStart);
    document.getElementById('rk-abort').addEventListener('click', A.rocketAbort);
    document.getElementById('rk-reset').addEventListener('click', A.rocketReset);

  };
  const SEQ = ['COUNTDOWN', 'BURN', 'COAST', 'DESCENT', 'LAND'];
  A.renderRocket = function (light) {
    const r = A.rocket;
    const g = id => document.getElementById(id);
    if (!g('g-rk-h')) return;
    const rho = 1.225 * Math.exp(-r.h / 8500);
    g('g-rk-h').textContent = r.h.toFixed(0) + ' m';
    g('g-rk-v').textContent = r.v.toFixed(1) + ' m/s';
    g('g-rk-a').textContent = ((r.thrust ? (r.thrust - 0.5 * rho * r.v * r.v * 0.0055) / (28 + r.prop) - 9.81 : -9.81) / 9.81).toFixed(1) + ' g';
    g('g-rk-p').textContent = r.prop.toFixed(0) + ' kg';
    g('g-rk-q').textContent = (0.5 * rho * r.v * r.v / 1000).toFixed(1) + ' kPa';
    if (!light) {

    }
    const seqEl = g('rk-seq');
    if (seqEl) seqEl.innerHTML = SEQ.map(s => {
      const idx = SEQ.indexOf(s), cur = SEQ.indexOf(r.phase === 'DESCENT' ? 'DESCENT' : r.phase);
      const done = r.phase === 'IDLE' ? r.fired.done : idx < cur;
      const now = r.phase === s;
      return '<div class="seq-step ' + (done ? 'done' : now ? 'now' : '') + '">' + App.I(now ? 'zap' : 'check', 13) + s + (s === 'BURN' && r.qMax ? ' \u00B7 max-Q ' + (r.qMax / 1000).toFixed(1) + ' kPa' : '') + '</div>';
    }).join('');
    const logEl = g('rk-log');
    if (logEl && light) logEl.innerHTML = r.events.slice().reverse().map(e => '<div class="log-line"><span class="t">T+' + e.t.toFixed(1) + 's</span>' + App.esc(e.msg) + '</div>').join('');
  };

  /* ================= DRONE TAB ================= */
  A.tabDrone = function (body) {

    body.innerHTML = `

          <div class="cfg-row"><span class="k">Roll trim</span><input type="range" id="dr-tr" min="-30" max="30" value="${d.trimRoll}"><span class="v" id="dr-trv">${d.trimRoll}\u00B0</span></div>

          <label class="check"><input type="checkbox" id="dr-stab" ${d.stabilize ? 'checked' : ''}> Stabilise mode (auto-level)</label>
          <div class="btn-row" style="margin-top:10px"><button class="btn sm primary" id="dr-run">${App.I('play', 13)} ${d.running ? 'Pause' : 'Start stream'}</button>
            <button class="btn sm ghost" id="dr-zero">${App.I('reset', 13)} Reset telemetry</button></div>
        </div>
        <div class="card"><canvas id="dr-cv" style="width:100%;height:230px"></canvas></div>
      </div>
      <div class="stack">
        <div class="card"><h3>${App.I('cpu', 16)} Sensor monitor</h3>
          <div class="tbl-scroll"><table class="tbl" id="dr-tbl">
            <tr><th>Channel</th><th>Value</th><th>Note</th></tr>
            <tr><td>Altitude</td><td id="dv-alt">0.0 m</td><td class="tiny muted">barometer model</td></tr>
            <tr><td>Battery</td><td id="dv-bat">100%</td><td class="tiny muted">voltage \u2192 SoC</td></tr>
            <tr><td>Roll</td><td id="dv-roll">0.0\u00B0</td><td class="tiny muted">gyro \u00B7 accel fusion</td></tr>
            <tr><td>Pitch</td><td id="dv-pitch">0.0\u00B0</td><td class="tiny muted">gyro \u00B7 accel fusion</td></tr>
            <tr><td>Motor output</td><td id="dv-mot">55%</td><td class="tiny muted">ESC mixer average</td></tr>
          </table></div>
          <div class="tiny muted" style="margin-top:8px">Mission 04 progresses while this stream runs.</div>
        </div>
        ${CONCEPT('Frame & power', 'A quadcopter needs a frame, four brushless motors, ESCs (electronic speed controllers), a power distribution board and a LiPo battery. Propeller pairs spin in opposite directions to cancel torque.')}
        ${CONCEPT('Flight controller', 'The FC fuses gyroscope + accelerometer (and often magnetometer/barometer) to estimate attitude, then mixes pilot input into per-motor commands hundreds of times per second.')}
        ${CONCEPT('Battery monitoring', 'LiPo cells must not over-discharge. FCs watch pack voltage under load and warn/brown-out near 3.3 V per cell — here, a simulated SoC curve.')}

    bindSliders([

  };
  A.renderDrone = function () {
    const d = A.drone;
    const cv = document.getElementById('dr-cv');
    if (!cv) return;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('dv-alt', d.alt.toFixed(1) + ' m'); set('dv-bat', d.batt.toFixed(0) + '%');

    set('dv-mot', Math.round(d.motorAvg || d.throttle) + '%');
    const {ctx, w, h} = App.Charts.prep(cv, 230);
    ctx.fillStyle = '#FDFBF6'; ctx.fillRect(0, 0, w, h);
    // artificial horizon (left half)
    const ahx = 90, ahy = h / 2, ahr = Math.min(80, h / 2 - 12);
    ctx.save(); ctx.beginPath(); ctx.arc(ahx, ahy, ahr, 0, 7); ctx.clip();
    ctx.translate(ahx, ahy); ctx.rotate(-d.roll * Math.PI / 180);
    const po = d.pitch * 2.4;    ctx.fillStyle = '#89966B'; ctx.fillRect(-140, -140 + po, 280, 140);
    ctx.fillStyle = '#C9B896'; ctx.fillRect(-140, po, 280, 140);
    ctx.strokeStyle = '#303329'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-140, po); ctx.lineTo(140, po); ctx.stroke();
    ctx.strokeStyle = 'rgba(48,51,41,.35)';
    for (let i = -3; i <= 3; i++) { if (!i) continue; ctx.beginPath(); ctx.moveTo(-22, po + i * 18); ctx.lineTo(22, po + i * 18); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = '#303329'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ahx, ahy, ahr, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#C5A66A'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(ahx - 30, ahy); ctx.lineTo(ahx - 10, ahy); ctx.moveTo(ahx + 10, ahy); ctx.lineTo(ahx + 30, ahy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ahx, ahy - 6); ctx.lineTo(ahx, ahy + 6); ctx.stroke();
    // motor mixer bars (right)
    const bx = 200, bw = w - bx - 30;
    const motors = [1, 2, 3, 4].map(i => App.clamp((d.motorAvg || d.throttle) + (i % 2 ? d.roll : -d.roll) * 0.5 + (i > 2 ? d.pitch : -d.pitch) * 0.5, 0, 100));
    ctx.font = '10px system-ui';
    motors.forEach((m, i) => {
      const x = bx + i * (bw / 4), top = 30, bh = 120;
      ctx.fillStyle = '#F1EADA'; ctx.fillRect(x, top, bw / 4 - 12, bh);
      ctx.fillStyle = '#46552B'; ctx.fillRect(x, top + bh * (1 - m / 100), bw / 4 - 12, bh * m / 100);
      ctx.fillStyle = '#5C6153'; ctx.textAlign = 'center';
      ctx.fillText('M' + (i + 1), x + (bw / 4 - 12) / 2, top + bh + 14);
      ctx.fillText(Math.round(m) + '%', x + (bw / 4 - 12) / 2, top - 8);
      ctx.textAlign = 'left';
    });
    ctx.fillStyle = '#303329'; ctx.font = '700 10px system-ui';
    ctx.fillText('ARTIFICIAL HORIZON', 20, 16);
    ctx.fillText('ESC MOTOR MIX (simulated)', bx - 10, 16);
    // battery strip
    ctx.fillStyle = '#F1EADA'; ctx.fillRect(20, h - 18, w - 40, 9);
    ctx.fillStyle = d.batt < 20 ? '#93402F' : '#46552B';
    ctx.fillRect(20, h - 18, (w - 40) * d.batt / 100, 9);
    ctx.font = '9px system-ui'; ctx.fillStyle = '#5C6153';
    ctx.fillText('BATTERY ' + d.batt.toFixed(0) + '% (simulated)', 20, h - 22);
  };

  /* ================= AIRCRAFT TAB ================= */
  A.tabAir = function (body) {
    const a = A.air;
    body.innerHTML = `
    <div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
      <div class="stack">
        <div class="card">
          <div class="spread"><h3>${App.I('rocket', 16)} Aircraft Instrument Panel</h3><span class="sim-tag">Simulated instruments</span></div>
          <p class="small muted">A classic \u201Csix-pack\u201D drawn live from the flight-state sliders. Watch how pitch drives vertical speed, and how the annunciator panel reacts to unsafe airspeeds.</p>
          <canvas id="air-cv" style="width:100%;height:300px"></canvas>
        </div>
        <div class="card"><h3>${App.I('alert', 16)} Warning annunciators</h3>
          <div class="annunciator" id="air-ann" style="margin-top:8px"></div>
          <div class="row" style="margin-top:12px"><span class="small muted">Simulated battery state:</span>
            <button class="btn sm ghost" id="air-batt">${a.lowBatt ? 'Restore battery' : 'Drain battery (demo warning)'}</button>
            <span class="small" id="air-altv"></span></div>
        </div>
      </div>
      <div class="stack">
        <div class="card"><h3>${App.I('gear', 16) || App.I('cpu', 16)} Flight state (simulated)</h3>
          <div class="cfg-row"><span class="k">Airspeed</span><input type="range" id="ai-spd" min="0" max="180" value="${a.spd}"><span class="v" id="ai-spdv">${a.spd} kt</span></div>
          <div class="cfg-row"><span class="k">Pitch</span><input type="range" id="ai-pit" min="-15" max="15" value="${a.pitch}"><span class="v" id="ai-pitv">${a.pitch}\u00B0</span></div>
          <div class="cfg-row"><span class="k">Bank</span><input type="range" id="ai-bnk" min="-45" max="45" value="${a.bank}"><span class="v" id="ai-bnkv">${a.bank}\u00B0</span></div>
          <div class="cfg-row"><span class="k">Heading</span><input type="range" id="ai-hdg" min="0" max="359" value="${a.hdg}"><span class="v" id="ai-hdgv">${a.hdg}\u00B0</span></div>
        </div>
        ${CONCEPT('The six-pack', 'Airspeed indicator, attitude indicator, altimeter, turn coordinator, heading indicator and vertical speed indicator — the classic basic instruments, still the training backbone before glass cockpits.')}
        ${CONCEPT('Avionics & navigation', 'Modern avionics add GPS/INS navigation, radios, transponders and synthetic vision. Navigation concepts: VOR radials, GPS waypoints, heading vs track, and why magnetic variation matters.')}
        ${CONCEPT('Warning systems', 'Annunciators (stall, overspeed, low voltage) are the aircraft\u2019s self-check voice. They light when sensor thresholds are crossed — exactly what this demo panel simulates.')}
      </div>
    </div>`;
    bindSliders([
      ['ai-spd', v => { a.spd = +v; document.getElementById('ai-spdv').textContent = v + ' kt'; A.airDraw(); }],
      ['ai-pit', v => { a.pitch = +v; document.getElementById('ai-pitv').textContent = v + '\u00B0'; A.airDraw(); }],

      ['ai-hdg', v => { a.hdg = +v; document.getElementById('ai-hdgv').textContent = v + '\u00B0'; A.airDraw(); }]

  A.tab3D = function (body) {

          <p class="small muted">Drag to rotate · scroll or pinch to zoom · click a part to inspect it. These are simplified teaching models built for this course — not flight-certified hardware and not to-scale engineering drawings.</p>
          <div class="seg" id="m3d-pick" style="margin-bottom:10px">

      </div>

    const wrap = document.getElementById('m3d-wrap');
    const cv = document.getElementById('m3d-cv');

    A._3d = App.A3D.create(cv, wrap, {
      onParts: parts => {
        const pl = document.getElementById('m3d-parts');
        pl.innerHTML = parts.map((p, i) => '<button class="part-item" data-i="' + i + '"><span class="dot" style="background:' + p.color + '"></span>' + App.esc(p.name) + '</button>').join('');
        pl.onclick = e => { const b = e.target.closest('.part-item'); if (b) A._3d.select(+b.dataset.i); };
      },
      onSelect: (part, i) => {
        if (!part) return; // deselection: A3D already restores the default panel
        document.getElementById('m3d-info').innerHTML = '<h3>' + App.esc(part.name) + '</h3><p class="small muted" style="margin:0">' + App.esc(part.info) + '</p>'
          + (part.spec ? '<div class="tiny" style="margin-top:8px;color:#7A5A22">Model values: ' + App.esc(part.spec) + '</div>' : '');
        App.$$('#m3d-parts .part-item').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
      }
    });
    document.getElementById('m3d-pick').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      App.$$('#m3d-pick button').forEach(x => x.classList.toggle('active', x === b));
      A._3d.setModel(b.dataset.m);

  };
})();

<script>
'use strict';
/* ============================================================
   AEROSPACE LAB — software 3D model viewer (no dependencies)
   Box-mesh models, painter's algorithm, part picking, drag
   rotate, wheel/pinch zoom. Lazy-initialised by the 3D tab.
   ============================================================ */
App.A3D = (() => {
  const LIGHT = norm([-0.45, -0.6, -0.8]);
  function norm(v) { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }
  function rotY(v, a) { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; }
  function rotX(v, a) { const c = Math.cos(a), s = Math.sin(a); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; }

  function box(ctr, size, ry) {
    const [x, y, z] = ctr, [sx, sy, sz] = size;
    let vs = [
      [x - sx, y - sy, z - sz], [x + sx, y - sy, z - sz], [x + sx, y + sy, z - sz], [x - sx, y + sy, z - sz],
      [x - sx, y - sy, z + sz], [x + sx, y - sy, z + sz], [x + sx, y + sy, z + sz], [x - sx, y + sy, z + sz]
    ].map(v => ry ? rotY(v, ry) : v);
    return {verts: vs, faces: [[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]]};
  }
  /* part: {name, color, info, spec, boxes:[[cx,cy,cz, hx,hy,hz, ry?]]} (half-sizes) */
  const P = (name, color, info, spec, boxes) => ({name, color, info, spec, boxes});
  const MODELS = {
    cubesat: [
      P('Structure (3U frame)', '#46552B', 'Anodised aluminium frame holding three 1U sections. Rails slide into the launch deployer and must survive vibration qualification.', '10\u00D710\u00D730 cm · \u2248 380 g', [[0,0,0, 15,5,5]]),
      P('Solar panels (4-face)', '#354321', 'Triple-junction cells on body-mounted panels feed the EPS. Body-mounted panels mean power depends heavily on attitude and eclipse time.', '\u2248 2.4 W avg (model)', [[0,-5.6,0, 14,.5,4.6], [0,5.6,0, 14,.5,4.6]]),
      P('EPS battery module', '#C5A66A', 'Lithium pack with charge regulator — the same system you simulated in the power tab.', '6S pack · 40 Wh (model)', [[-8,0,0, 3,3.4,3.4]]),
      P('Onboard computer', '#89966B', 'Runs the flight software, schedules tasks, manages power modes and packs telemetry frames.', 'COTS MCU board (model)', [[6,0,0, 3,3.4,3.4]]),
      P('UHF antenna', '#A8B18A', 'Tape monopole deployed after ejection; the radio downlinks health telemetry to the ground station.', '433 MHz · \u2248 2 W EIRP (model)', [[0,8,0, .6,3,.6], [0,12.4,0, .3,1.6,.3]]),
      P('Camera payload', '#303329', 'Educational imaging payload: captures Earth images and stores them for scheduled downlink.', '2 MP · 1 fps burst (model)', [[13.4,0,0, 2.4,2.4,2.4]])
    ],
    rocket: [
      P('Nose cone', '#C5A66A', 'Conical nose reduces drag and houses the recovery electronics bay in real sounding rockets.', '\u2248 18 cm (model)', [[0,-34,0, 4.5,7,4.5]]),
      P('Avionics bay', '#46552B', 'Flight computer, IMU, barometer and radio — it runs the launch state machine you fired in the avionics tab.', '9V rail · 10 Hz logging (model)', [[0,-19,0, 4.5,8,4.5]]),
      P('Body tube', '#89966B', 'Main airframe carrying propellant tanks (here, a solid motor casing) through Max-Q.', 'Kraft phenolic tube (model)', [[0,0,0, 4.5,11,4.5]]),
      P('Motor casing', '#303329', 'Solid motor producing the 1500 N thrust curve used by the flight simulator.', '1500 N avg · 45 s burn (model)', [[0,19,0, 4.7,8,4.7]]),
      P('Fin set (3)', '#93402F', 'Three trapezoidal fins keep the rocket passively stable — centre of pressure behind centre of gravity.', '3\u00D7 12 cm span (model)', [[4.5,29,0, 1,.5,6], [-2.3,29,4, 1,.5,6, Math.PI/3], [-2.3,29,-4, 1,.5,6, -Math.PI/3]]),
      P('Engine nozzle', '#DED1B9', 'Expands and accelerates exhaust; bell shape maximises thrust coefficient at sea level.', '\u2248 4 cm exit \u00D8 (model)', [[0,30.5,0, 3,3,3]])
    ],
    drone: [
      P('Centre plate', '#46552B', 'Carbon-fibre main plate mounting the flight controller and power distribution board.', 'F3.5-class frame (model)', [[0,0,0, 5,1,5]]),
      P('Arm + rotor FL', '#354321', 'Front-left arm and brushless motor with propeller; spins clockwise on a conventional quad.', '\u2248 2306 prop (model)', [[-6,-1,-6, 3.5,.7,3.5, Math.PI/4], [-9,-1.8,-9, 3,.4,3]]),
      P('Arm + rotor FR', '#89966B', 'Front-right arm; counter-rotating propeller cancels aerodynamic torque.', '\u2248 2306 prop (model)', [[6,-1,-6, 3.5,.7,3.5, -Math.PI/4], [9,-1.8,-9, 3,.4,3]]),
      P('Arm + rotor RL', '#89966B', 'Rear-left arm. The mixer combines throttle, roll, pitch and yaw into four motor commands.', '\u2248 2306 prop (model)', [[-6,-1,6, 3.5,.7,3.5, -Math.PI/4], [-9,-1.8,9, 3,.4,3]]),
      P('Arm + rotor RR', '#354321', 'Rear-right arm; ESCs translate mixer output into precise motor speeds.', '\u2248 2306 prop (model)', [[6,-1,6, 3.5,.7,3.5, Math.PI/4], [9,-1.8,9, 3,.4,3]]),
      P('LiPo battery', '#C5A66A', '4S lithium-polymer pack strapped under the plate; voltage sag under throttle is the health signal you monitored.', '4S 1500 mAh (model)', [[0,2.2,0, 3.4,1.3,2.2]])
    ]
  };

  function hex2rgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function create(canvas, wrap, cb) {
    const ctx = canvas.getContext('2d');
    let model = MODELS.cubesat, yaw = 0.6, pitch = 0.35, dist = 110, parts = [], selIdx = -1, raf = 0, disposed = false, lastFaces = [];
    const pointers = new Map();
    let drag = null, pinch = null;
    function build() {
      parts = [];
      model.forEach((p, pi) => {
        p.boxes.forEach(bx => {
          const b = Array.isArray(bx[0]) ? bx[0] : bx; // tolerate double-nested box definitions
          const [cx, cy, cz, hx, hy, hz, ry] = b;
          const m = box([cx, cy, cz], [hx, hy, hz], ry || 0);
          m.faces.forEach(f => parts.push({pi, face: f, verts: f.map(i => m.verts[i])}));
        });
      });
      if (cb.onParts) cb.onParts(model);
      if (selIdx >= 0 && cb.onSelect) cb.onSelect(model[Math.min(selIdx, model.length - 1)], selIdx);
    }
    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = wrap.clientWidth, h = Math.max(360, wrap.clientHeight);
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return {w, h};
    }
    function transform(v) {
      let p = rotY(v, yaw);
      p = rotX(p, pitch);
      p = [p[0], p[1], p[2] + dist];
      return {x: p[0], y: p[1], z: p[2]};
    }
    function project(v, w, h) {
      const f = Math.min(w, h) * 2.1;
      const s = f / v.z;
      return {x: w / 2 + v.x * s, y: h / 2 - v.y * s, z: v.z};
    }
    function inQuad(px, py, pts) {
      let sign = 0, ok = true;
      for (let i = 0; i < 4; i++) {
        const a = pts[i], b = pts[(i + 1) % 4];
        const cr = (b.x - a.x) * (py - a.y) - (b.y - a.y) * (px - a.x);
        const s = cr > 0 ? 1 : -1;
        if (sign === 0) sign = s; else if (s !== sign) { ok = false; break; }
      }
      return ok;
    }
    function render() {
      if (disposed) return;
      raf = requestAnimationFrame(render);
      const {w, h} = sizeCanvas();
      ctx.clearRect(0, 0, w, h);
      const faces = [];
      parts.forEach(f => {
        const tv = f.verts.map(transform);
        const pv = tv.map(v => project(v, w, h));
        // normal in view space (before projection)
        const u = [tv[1].x - tv[0].x, tv[1].y - tv[0].y, tv[1].z - tv[0].z];
        const v = [tv[3].x - tv[0].x, tv[3].y - tv[0].y, tv[3].z - tv[0].z];
        let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
        const nl = Math.hypot(n[0], n[1], n[2]) || 1;
        n = [n[0] / nl, n[1] / nl, n[2] / nl];
        if (n[2] > 0.02) return; // back-face cull (camera looks toward +dist)
        const zAvg = (tv[0].z + tv[1].z + tv[2].z + tv[3].z) / 4;
        const bright = 0.42 + 0.58 * Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
        faces.push({f, pv, zAvg, bright});
      });
      faces.sort((a, b) => b.zAvg - a.zAvg);
      faces.forEach(({f, pv, bright}) => {
        const [r0, g0, b0] = hex2rgb(model[f.pi].color);
        const sel = f.pi === selIdx;
        ctx.beginPath();
        ctx.moveTo(pv[0].x, pv[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(pv[i].x, pv[i].y);
        ctx.closePath();
        ctx.fillStyle = sel ? 'rgb(' + Math.round(197 * bright) + ',' + Math.round(166 * bright) + ',' + Math.round(106 * bright) + ')'
          : 'rgb(' + Math.round(r0 * bright) + ',' + Math.round(g0 * bright) + ',' + Math.round(b0 * bright) + ')';
        ctx.fill();
        ctx.strokeStyle = sel ? '#A8853F' : 'rgba(48,51,41,.28)';
        ctx.lineWidth = sel ? 1.6 : 1;
        ctx.stroke();
        f._pv = pv;
      });
      // soft ground shadow
      ctx.fillStyle = 'rgba(70,85,43,.08)';
      ctx.beginPath(); ctx.ellipse(w / 2, h - 22, Math.min(w, h) * .22, 14, 0, 0, 7); ctx.fill();
      ctx.font = '10.5px system-ui'; ctx.fillStyle = '#5C6153';
      ctx.fillText('drag = rotate · wheel/pinch = zoom · click part = inspect', 14, h - 30);
      lastFaces = faces;
    }
    function pick(px, py) {
      for (const {f, pv} of lastFaces) if (inQuad(px, py, pv)) return f.pi;
      return -1;
    }
    canvas.addEventListener('pointerdown', e => {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
      const r = canvas.getBoundingClientRect();
      pointers.set(e.pointerId, {x: e.clientX - r.left, y: e.clientY - r.top});
      if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        pinch = {d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), dist};
        drag = null;
      } else drag = {x: e.clientX - r.left, y: e.clientY - r.top};
    });
    canvas.addEventListener('pointermove', e => {
      const r = canvas.getBoundingClientRect();
      const p = {x: e.clientX - r.left, y: e.clientY - r.top};
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
      if (pinch && pointers.size === 2) {
        const pts = Array.from(pointers.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        dist = App.clamp(pinch.dist * (pinch.d / d), 55, 320);
        return;
      }
      if (drag) {
        yaw += (p.x - drag.x) * 0.011;
        pitch = App.clamp(pitch + (p.y - drag.y) * 0.008, -1.4, 1.4);
        drag = p;
      }
    });
    const up = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (drag && e.type === 'pointerup') {
        const r = canvas.getBoundingClientRect();
        const i = pick(e.clientX - r.left, e.clientY - r.top);
        if (i >= 0) select(i);
        else if (Math.hypot((e.clientX - r.left) - drag.x, (e.clientY - r.top) - drag.y) < 4) select(-1);
      }
      drag = null;
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('wheel', e => { e.preventDefault(); dist = App.clamp(dist * (e.deltaY > 0 ? 1.1 : 0.9), 55, 320); }, {passive: false});
    function select(i) {
      selIdx = i;
      if (cb.onSelect) cb.onSelect(i >= 0 ? model[i] : null, i);
      if (i < 0) {
        document.getElementById('m3d-info').innerHTML = '<h3>Inspect a part</h3><p class="small muted" style="margin:0">Click a part in the model or in this list to see its educational description and model values.</p>';
        App.$$('#m3d-parts .part-item').forEach(el => el.classList.remove('sel'));
      }
    }
    build();
    render();
    return {
      setModel(key) { if (MODELS[key]) { model = MODELS[key]; selIdx = -1; select(-1); build(); } },
      select(i) { select(i); },
      dispose() { disposed = true; cancelAnimationFrame(raf); },
      dbg: null // debug hook removed in production build
    };
  }
  return {create, MODELS};
})();

</script>
<script>
'use strict';
/* ============================================================
   LAB 03 — SIMULATION & MISSION CONTROL
   Session recorder · waveform viewer · timeline · diagnostics ·
   results dashboard · exportable reports (JSON + CSV)
   ============================================================ */
App.SimLab = {
  view: {selId: null, cursor: 0, playing: false, timer: null, compare: false},
  TYPES: {electronics: 'Electronics', satellite: 'Satellite', rocket: 'Rocket', drone: 'Drone'},
  record(sess) {
    const st = App.Store.state;
    st.simSessions = st.simSessions || [];
    // keep browser storage small: decimate dense tracks & trim event logs
    // before persisting (charts render the same shape with ~1200 points)
    const slimTrack = t => {
      if (!t || !Array.isArray(t.data)) return t;
      const CAP = 1200;
      if (t.data.length <= CAP) return t;
      const step = Math.ceil(t.data.length / CAP);
      const out = [];
      for (let i = 0; i < t.data.length; i += step) out.push(t.data[i]);
      const last = t.data[t.data.length - 1];
      if (out[out.length - 1] !== last) out.push(last);
      return Object.assign({}, t, {data: out});
    };
    const slim = Object.assign({}, sess, {tracks: (sess.tracks || []).map(slimTrack), events: (sess.events || []).slice(-60)});
    st.simSessions.unshift(slim);
    if (st.simSessions.length > 20) st.simSessions.length = 20;
    // sync into the linked project (cross-lab workflow, autosave on)
    const pid = App.Store.state.ui.activeProjectId;
    if (pid && App.Store.state.settings.autosave) {
      const pr = App.Store.state.projects.find(p => p.id === pid);
      if (pr) {
        pr.data.simulation = {format: 2, lastSessionId: sess.id, recordedAt: Date.now(),
          summary: {type: sess.type, dur_s: sess.dur, tracks: sess.tracks.map(t => ({label: t.label, kind: t.kind, samples: t.data.length}))}};
        if (sess.type === 'satellite' && sess.meta && sess.meta.cfg) { pr.data.aerospace = pr.data.aerospace || {}; pr.data.aerospace.satCfg = sess.meta.cfg; }
        pr.updatedAt = Date.now();
      }
    }
    App.Store.save();
    App.Bus.emit('sessions', st.simSessions);
    App.notify('Simulation "' + sess.name + '" recorded in Mission Control.', 'activity');
  },
  current() {
    const st = App.Store.state;
    st.simSessions = st.simSessions || [];
    return st.simSessions.find(s => s.id === this.view.selId) || st.simSessions[0] || null;
  },
  exportJSON(sess) {
    const report = {
      generator: 'CircuitVerse Studio v' + App.VERSION,
      exportedAt: new Date().toISOString(),
      disclaimer: 'All data in this report is simulated educational output, not real hardware measurements.',
      session: {id: sess.id, type: sess.type, name: sess.name, startedAt: sess.startedAt, duration_s: sess.dur, sampleRate_per_s: sess.rate},
      tracks: sess.tracks.map(t => ({label: t.label, kind: t.kind, unit: t.unit || null, samples: t.data.length, min: t.kind === 'analog' ? Math.min.apply(null, t.data) : null, max: t.kind === 'analog' ? Math.max.apply(null, t.data) : null})),
      events: sess.events,
      meta: sess.meta
    };
    App.download('cv_report_' + sess.type + '_' + sess.id.slice(-6) + '.json', JSON.stringify(report, null, 2), 'application/json');
    App.Missions.bump('reportExport');
    App.UI.toast('Report exported (JSON).');
  },
  exportCSV(sess) {
    const n = Math.max.apply(null, sess.tracks.map(t => t.data.length).concat([1]));
    const rows = [['time_s'].concat(sess.tracks.map(t => t.label.replace(/,/g, ';')))];
    for (let i = 0; i < n; i++) {
      rows.push([(i / (sess.rate || 1)).toFixed(3)].concat(sess.tracks.map(t => t.data[i] != null ? t.data[i] : '')));
    }
    App.download('cv_session_' + sess.id.slice(-6) + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv');
    App.Missions.bump('reportExport');
    App.UI.toast('Session exported (CSV).');
  }
};

SL.drawWave = function () {
  const s = SL.current();
  const cv = document.getElementById('mc-cv');
  if (!s || !cv) return;
  const {ctx, w, h} = App.Charts.prep(cv, 300);
  ctx.fillStyle = '#FDFBF6'; ctx.fillRect(0, 0, w, h);
  const dig = s.tracks.filter(t => t.kind === 'digital');
  const ana = s.tracks.filter(t => t.kind === 'analog');
  const n = Math.max.apply(null, s.tracks.map(t => t.data.length).concat([1]));
  const x = i => 46 + (w - 56) * (n <= 1 ? 0 : i / (n - 1));
  // time axis
  ctx.font = '9.5px system-ui'; ctx.fillStyle = '#5C6153';
  const dur = s.dur || n / (s.rate || 1);
  for (let g = 0; g <= 5; g++) {
    const gx = 46 + (w - 56) * g / 5;
    ctx.strokeStyle = 'rgba(70,85,43,.14)';
    ctx.beginPath(); ctx.moveTo(gx, 8); ctx.lineTo(gx, h - 16); ctx.stroke();
    ctx.fillText((dur * g / 5).toFixed(0) + 's', gx - 8, h - 3);
  }
  // digital tracks (top)
  let y = 18;
  dig.forEach(t => {
    const th = 24;
    ctx.font = '9px system-ui'; ctx.fillStyle = '#5C6153';
    ctx.fillText(t.label.slice(0, 22), 4, y + th / 2 + 3);
    ctx.strokeStyle = t.color || '#46552B'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const v = t.data[i] != null ? t.data[i] : 0;
      const vy = v ? y + 3 : y + th - 3;
      if (!started) { ctx.moveTo(x(i), vy); started = true; }
      else { ctx.lineTo(x(i), vy); ctx.lineTo(x(i), vy); }
      const nv = t.data[i + 1] != null ? t.data[i + 1] : v;
      if (nv !== v) { const nvx = x(i + 1) || w - 10; ctx.lineTo((x(i) + nvx) / 2, vy); ctx.lineTo((x(i) + nvx) / 2, nv ? y + th - 3 : y + 3); }
    }
    ctx.stroke();
    y += th + 8;
  });
  // analog tracks (bottom)
  let aTop = y + 6, aH = (h - 22 - aTop) / Math.max(1, ana.length) - 10;
  ana.forEach(t => {
    let mn = Math.min.apply(null, t.data), mx = Math.max.apply(null, t.data);
    if (!isFinite(mn) || mx - mn < 1e-9) { mn -= 1; mx += 1; }
    ctx.strokeStyle = 'rgba(70,85,43,.12)';
    ctx.strokeRect(46, aTop, w - 56, aH);
    ctx.font = '9px system-ui'; ctx.fillStyle = '#5C6153';
    ctx.fillText(t.label.slice(0, 22) + (t.unit ? ' (' + t.unit + ')' : ''), 4, aTop + 8);
    ctx.strokeStyle = t.color || '#46552B'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const v = t.data[i] != null ? t.data[i] : mn;
      const vy = aTop + aH * (1 - (v - mn) / (mx - mn));
      i ? ctx.lineTo(x(i), vy) : ctx.moveTo(x(i), vy);
    }
    ctx.stroke();
    aTop += aH + 12;
  });
  // compare overlay
  if (SL.view.compare) {
    const prev = App.Store.state.simSessions.find(px => px.type === s.type && px.id !== s.id);
    if (prev) {
      ctx.globalAlpha = 0.3;
      const pn = Math.max.apply(null, prev.tracks.map(t => t.data.length).concat([1]));
      let ay = 18 + (dig.length) * 32 + 6;
      prev.tracks.filter(t => t.kind === 'analog').forEach(t => {
        let mn = Math.min.apply(null, t.data), mx = Math.max.apply(null, t.data);
        if (mx - mn < 1e-9) { mn -= 1; mx += 1; }
        ctx.strokeStyle = '#303329'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < pn; i++) {
          const v = t.data[i] != null ? t.data[i] : mn;
          const vy = ay + aH * (1 - (v - mn) / (mx - mn));
          const px = 46 + (w - 56) * i / Math.max(1, pn - 1);
          i ? ctx.lineTo(px, vy) : ctx.moveTo(px, vy);
        }
        ctx.stroke();
        ay += aH + 12;
      });
      ctx.globalAlpha = 1;
      ctx.font = '9px system-ui'; ctx.fillStyle = '#303329';
      ctx.fillText('ghost: previous run "' + prev.name.slice(0, 24) + '"', 46, h - 20);
    }
  }
  // cursor
  const cx = x(SL.view.cursor);
  ctx.strokeStyle = '#93402F'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, h - 16); ctx.stroke(); ctx.setLineDash([]);
  const el = document.getElementById('mc-cur');
  if (el) el.textContent = (SL.view.cursor / (s.rate || 1)).toFixed(1) + ' s';
};

  App.Routes.settings = {

      const T = (k, label, desc) => `<div class="insp-row" style="padding:12px 0"><div><b style="font-size:13.5px">${label}</b><div class="tiny muted">${desc}</div></div><button class="toggle ${s[k] ? 'on' : ''}" data-set="${k}"></button></div>`;
      return `
      <div class="grid c2" style="max-width:900px">
        <div class="card">
          <h3>${I('gear', 15)} Preferences</h3>
          ${T('reduceMotion', 'Reduce motion', 'Disables page transitions and micro-animations.')}

            <div class="progress" style="margin:10px 0 4px"><i style="width:${pct}%"></i></div>
            <div class="tiny muted">${size} used of ~5 MB typical browser quota · ${st.simSessions.length} simulation recording${st.simSessions.length === 1 ? '' : 's'} stored. Tip: other apps hosted on the same site domain share this quota.</div>
            <div class="btn-row" style="margin-top:10px">

              <button class="btn sm ghost" id="st-prune">${I('reset', 13)} Free up space</button>

            <div class="row" style="margin-top:8px"><span class="version-chip">v${App.VERSION}</span><span class="version-chip">format v2</span><span class="version-chip">offline-capable</span></div>
          </div>
        </div>

    mount() {
      App.$$('[data-set]').forEach(t => t.addEventListener('click', () => {
        const k = t.dataset.set;
        App.Store.state.settings[k] = !App.Store.state.settings[k];
        if (k === 'reduceMotion') document.body.classList.toggle('reduce-motion', App.Store.state.settings.reduceMotion);
        App.Store.save();
        App.Router.render();
      }));
      document.getElementById('st-export').addEventListener('click', () => {
        App.download('circuitverse_backup.json', App.Store.exportAll(), 'application/json');
        App.UI.toast('Backup exported.');
      });
      document.getElementById('st-prune').addEventListener('click', () => {
        const removed = App.Store.pruneSessions(5);
        App.Store.saveNow();
        App.UI.toast(removed ? removed + ' old simulation recording(s) cleared — ' + App.bytes(JSON.stringify(App.Store.state).length) + ' now in use.' : 'Nothing to clear — fewer than 5 recordings stored.');
        App.Router.render();

      document.getElementById('st-import').addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try { App.Store.importAll(rd.result); App.UI.toast('Backup imported — reloading.'); setTimeout(() => location.reload(), 700); }
          catch (err) { App.UI.toast('Import failed: ' + err.message, 'err'); }
        };
        rd.readAsText(f);
      });
      document.getElementById('st-clear').addEventListener('click', async () => {
        if (await App.UI.confirm('Clear all data', 'This permanently deletes accounts, projects, sessions and feedback stored in this browser. Export a backup first if unsure.', 'Delete everything', true)) {
          if (await App.UI.confirm('Are you sure?', 'Last chance — this cannot be undone.', 'Yes, wipe it', true)) {
            localStorage.removeItem(App.Store.KEY);
            location.reload();
          }
        }
      });
    }
  };
})();

<script>
'use strict';
/* ============================================================
   MY PROJECTS — create / open / rename / duplicate / delete /
   search / filter / sort / export ZIP
   Project format v2: {id,name,desc,lab,owner,createdAt,updatedAt,
     data:{electronics,aerospace,simulation}, github:{user,exportedAt}}
   ============================================================ */
App.Projects = {
  create(name, desc, lab) {
    const c = App.Auth.current();
    const pr = {id: App.uid('p'), name: (name || 'Untitled project').trim(), desc: (desc || '').trim(),
      lab: lab || 'electronics', owner: c ? (c.guest ? 'guest' : c.email) : 'guest',
      createdAt: Date.now(), updatedAt: Date.now(), format: 2,
      data: {electronics: null, aerospace: null, simulation: null}, github: null};
    App.Store.state.projects.unshift(pr);
    const p = App.Profile.get();
    if (p) { p.stats.projects = (p.stats.projects || 0) + 1; }
    if (p && p.stats && p.stats.projects >= 3) {
      if (!p.badges.find(b => b.id === 'b_proj3')) { p.badges.push({id: 'b_proj3', at: Date.now()}); App.UI.toast('Badge earned — Archivist (3 projects)', 'gold'); }
    }
    if (p && App.Profile.levelInfo(p.xp).level >= 3 && !p.badges.find(b => b.id === 'b_lvl3')) { p.badges.push({id: 'b_lvl3', at: Date.now()}); }
    if (p && App.Profile.levelInfo(p.xp).level >= 5 && !p.badges.find(b => b.id === 'b_lvl5')) { p.badges.push({id: 'b_lvl5', at: Date.now()}); }
    if (p && p.streak.count >= 3 && !p.badges.find(b => b.id === 'b_streak3')) { p.badges.push({id: 'b_streak3', at: Date.now()}); }
    App.Store.save();
    App.notify('Project "' + pr.name + '" created.', 'folder');
    return pr;
  },
  get(id) { return App.Store.state.projects.find(p => p.id === id); },
  open(id) {
    const pr = this.get(id);
    if (!pr) return;    App.Store.state.ui.activeProjectId = id;
    App.Store.save();
    if (pr.data.electronics && App.E) { App.E.load(pr.data.electronics); App.E._loadedFromRoute = true; }
    if (pr.data.aerospace && App.A) {
      if (pr.data.aerospace.satCfg) { Object.assign(App.A.sat.cfg, pr.data.aerospace.satCfg); }
    }
    App.Router.go(pr.lab === 'aerospace' ? 'aerospace' : pr.lab === 'simulation' ? 'simulation' : 'electronics');
    App.Router.render();
    App.UI.toast('Project "' + pr.name + '" opened in ' + pr.lab + ' context.');
  },
  rename(id) {
    const pr = this.get(id);
    if (!pr) return;
    App.UI.prompt('Rename project', '<div class="field"><label>Project name</label><input class="input" name="name" value="' + App.esc(pr.name) + '" maxlength="60"></div><div class="field"><label>Description</label><textarea class="input" name="desc">' + App.esc(pr.desc || '') + '</textarea></div>').then(v => {
      if (!v) return;
      pr.name = v.name.trim() || pr.name;
      pr.desc = v.desc.trim();
      pr.updatedAt = Date.now();
      App.Store.save();
      App.Router.render();
      App.UI.toast('Project updated.');
    });
  },
  async duplicate(id) {
    const pr = this.get(id);
    if (!pr) return;
    const copy = JSON.parse(JSON.stringify(pr));
    copy.id = App.uid('p');
    copy.name = pr.name + ' (copy)';
    copy.createdAt = copy.updatedAt = Date.now();
    copy.github = null;
    App.Store.state.projects.unshift(copy);
    App.Store.save();
    App.UI.toast('Duplicated as "' + copy.name + '".');
    App.Router.render();
  },
  async del(id) {
    const pr = this.get(id);
    if (!pr) return;
    if (await App.UI.confirm('Delete project', 'Delete "' + pr.name + '" and its saved lab data? This cannot be undone.', 'Delete', true)) {
      App.Store.state.projects = App.Store.state.projects.filter(p => p.id !== id);
      if (App.Store.state.ui.activeProjectId === id) App.Store.state.ui.activeProjectId = null;
      App.Store.save();
      App.Router.render();
      App.UI.toast('Project deleted.');
    }
  },
  exportZIP(id) {
    const pr = this.get(id);
    if (!pr) return;
    const files = App.GitHub.buildRepoFiles(pr);
    const zipName = (pr.name || 'project').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'project';
    const bytes = App.Zip.build(files);
    const p = App.Profile.get();
    if (p) p.stats.exports = (p.stats.exports || 0) + 1;
    pr.github = pr.github || {};
    pr.github.exportedAt = Date.now();
    App.Store.save();
    App.download(zipName + '_CircuitVerse.zip', new Blob([bytes], {type: 'application/zip'}));
    App.Missions.bump('repoBundle');
    App.UI.toast('Repository bundle exported (' + App.bytes(bytes.length) + ').');
  }
};

<script>
'use strict';
/* ============================================================
   GITHUB PUBLISHING — honest, browser-only pipeline.
   Real OAuth requires an OAuth App + backend callback; a static
   page cannot hold a client secret. So this build:
   - NEVER asks for personal access tokens in any text field
   - NEVER claims a repository was created unless GitHub says so
   - generates the exact repository file tree as a ZIP the
     student uploads themselves (github.com/new drag & drop,
     GitHub Desktop, or git push)
   ============================================================ */
App.GitHub = {
  b64ToBytes(b64) {
    const bin = atob(b64.split(',')[1]);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  },
  componentCounts(pr) {
    const el = pr.data && pr.data.electronics;
    if (!el || !el.comps) return [];
    const counts = {};
    el.comps.forEach(c => { const n = App.E.DEFS[c.key] ? App.E.DEFS[c.key].name : c.key; counts[n] = (counts[n] || 0) + 1; });
    return Object.entries(counts).map(([k, v]) => v + '\u00D7 ' + k).sort();
  },
  readme(pr) {
    const prof = App.Store.state.profiles[pr.owner];
    const name = prof ? prof.name : 'CircuitVerse Student';
    const comps = this.componentCounts(pr);
    const sim = App.Store.state.simSessions.find(s => s.id === (pr.data.simulation && pr.data.simulation.lastSessionId));
    const simLine = sim ? sim.name + ' (' + (sim.dur || 0).toFixed(1) + ' s, ' + sim.tracks.length + ' tracks — see simulation/results.json)' : 'No simulation recorded yet.';
    return `# ${pr.name}

> Built with **CircuitVerse Studio** — *Design. Simulate. Explore.*

**Student:** ${name}
**Lab category:** ${pr.lab}
**Created:** ${new Date(pr.createdAt).toISOString().slice(0, 10)}

## Description

${pr.desc || '_No description provided by the author._'}

## Objectives

- ${pr.lab === 'electronics' ? 'Design and validate a digital circuit with manual terminal-to-terminal wiring.' : pr.lab === 'aerospace' ? 'Model an aerospace system (satellite power / rocket avionics / UAV telemetry) with the built-in simulators.' : 'Record and analyse simulation sessions in Mission Control.'}
- Practise the full engineering loop: build → simulate → analyse → document → publish.

## Components used

${comps.length ? comps.map(c => '- ' + c).join('\n') : '_No electronics components recorded in this project._'}

## Circuit / system explanation

${pr.data && pr.data.electronics ? 'The electronics workspace contains a digital circuit (see `electronics/circuit.json` and the rendered image `electronics/circuit.png`). Wiring is a graph of terminal-to-terminal connections; the built-in simulator evaluates HIGH/LOW nets, LED/button/switch behaviour and simple logic ICs.' : pr.data && pr.data.aerospace ? 'This project stores an aerospace configuration (see `aerospace/`). All values are produced by the educational simulators.' : 'This project groups lab configuration and results stored by CircuitVerse Studio.'}

## Screenshots

- \`electronics/circuit.png\` — rendered view of the circuit workspace (generated on export).

## Simulation results

${simLine}

**All values in this repository are simulated educational outputs, not real hardware measurements.**

## Instructions

1. Open \`CircuitVerse Studio\` (single HTML file app).
2. Recreate or load \`project/project.json\` via the Projects page / lab workspaces.
3. Re-run the simulation and compare with \`simulation/results.json\`.

## Limitations

- Digital-only circuit simulation (HIGH/LOW logic); no analog current/voltage solving, no Arduino C++ execution.
- Aerospace models are simplified teaching models — not flight-certified tools.
- Simulator data must never be presented as real-world measurements.
`;
  },
  buildRepoFiles(pr) {
    const files = [];
    const j = o => JSON.stringify(o, null, 2);
    files.push({path: 'README.md', data: this.readme(pr)});
    const projCopy = JSON.parse(JSON.stringify(pr));
    files.push({path: 'project/project.json', data: j(projCopy)});
    const el = pr.data && pr.data.electronics;
    if (el && Array.isArray(el.comps) && el.comps.length) {
      files.push({path: 'electronics/circuit.json', data: j(el)});
      try {
        const cv = App.E.renderPNG(el);
        if (cv) files.push({path: 'electronics/circuit.png', data: this.b64ToBytes(cv.toDataURL('image/png')), binary: true});
      } catch (e) { console.warn('png render failed', e); }
      const comps = this.componentCounts(pr);
      files.push({path: 'documentation/components.md', data: '# Components\n\n' + (comps.length ? comps.map(c => '- ' + c).join('\n') : '_empty_') + '\n\nComponent behaviour reference lives in the CircuitVerse Studio library.\n'});
      files.push({path: 'documentation/experiment.md', data: '# Experiment notes\n\n'
        + '## Wiring summary\n' + (el.wires || []).length + ' wires between ' + el.comps.length + ' components.\n\n'
        + '## Pin configuration\n' + Object.keys(el.pinModes || {}).map(cid => Object.keys(el.pinModes[cid]).map(pid => pid + ': ' + el.pinModes[cid][pid].mode + (el.pinModes[cid][pid].blink ? ' (blink)' : '')).join('; ')).filter(Boolean).join('\n') + '\n\n'
        + '## Validation\nRun the Validate action in the Electronics Lab before publishing updates.\n'});
    }
    const ae = pr.data && pr.data.aerospace;
    if (ae && ae.satCfg) {
      files.push({path: 'aerospace/configuration.json', data: j(ae)});
      files.push({path: 'aerospace/model.json', data: j({model: 'CubeSat 3U educational power model', keplerPeriodMin: +(2 * Math.PI * Math.sqrt(Math.pow(6371 + ae.satCfg.alt, 3) / 398600) / 60).toFixed(1), note: 'Simplified educational model — 60x time compression, sine eclipse cycle'})});
    }
    const sim = App.Store.state.simSessions.find(s => s.id === (pr.data && pr.data.simulation && pr.data.simulation.lastSessionId));
    if (sim) {
      files.push({path: 'simulation/results.json', data: j({session: {id: sim.id, type: sim.type, name: sim.name, duration_s: sim.dur}, tracks: sim.tracks.map(t => ({label: t.label, kind: t.kind, unit: t.unit || null, samples: t.data.length, min: t.kind === 'analog' ? Math.min.apply(null, t.data) : null, max: t.kind === 'analog' ? Math.max.apply(null, t.data) : null})), disclaimer: 'SIMULATED educational data — not real hardware readings.'})});
      files.push({path: 'simulation/logs/events.log', data: (sim.events || []).map(e => new Date(e.t).toISOString() + ' ' + e.msg).join('\n') || 'no events'});
    }
    return files;
  },
  tree(paths) {
    // build a simple folder tree view
    const root = {};
    paths.forEach(p => {
      const parts = p.path.split('/');
      let node = root;
      parts.forEach((part, i) => {
        if (i === parts.length - 1) (node._files = node._files || []).push({name: part, path: p.path});
        else node = node[part] = node[part] || {};
      });
    });
    const walk = (node, prefix) => {
      let html = '';
      Object.keys(node).filter(k => k !== '_files').sort().forEach(dir => {
        html += '<div>' + prefix + '<span class="dir">' + dir + '/</span></div>' + walk(node[dir], prefix + '&nbsp;&nbsp;');
      });
      (node._files || []).forEach(f => { html += '<div>' + prefix + '<span class="file" data-path="' + f.path + '">' + f.name + '</span></div>'; });
      return html;
    };
    return walk(root, '');
  }
};
